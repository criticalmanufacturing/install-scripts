# Default values for the ClickHouse chart (Critical Manufacturing MES v12 dependencies).
#
# install.sh passes one values file to every chart. This chart reads only "global"
# and "clickhouse"; everything else is ignored. The defaults below are production defaults:
# most administrators only change the storage size and, if needed, the StorageClass.
#
# What is installed:
#   - ClickHouse Keeper: <prefix>-keeper (StatefulSet, odd number of pods, Raft quorum)
#   - ClickHouse server: <prefix>-clickhouse (StatefulSet, 1 shard x N replicas)
#   - Services: <prefix>-clickhouse (native TLS 9440, HTTPS 8443) used by CM MES,
#     <prefix>-clickhouse-headless and <prefix>-keeper-headless (per-pod DNS names)
#   - Secret <prefix>-clickhouse-connection with the values for the CM MES installer

# ---------------------------------------------------------------------------------
# Settings shared by all the dependency charts.
# ---------------------------------------------------------------------------------
global:
  # Prefix of every resource name, e.g. "cmmes" gives the StatefulSet "cmmes-clickhouse".
  namePrefix: cmmes
  # StorageClass for the persistent volumes. "" = the cluster default StorageClass.
  storageClass: ""
  # Private registry/mirror put in front of every image, e.g. "registry.example.com/mirror".
  # "" = pull from Docker Hub.
  imageRegistry: ""
  # Names of Secrets (type kubernetes.io/dockerconfigjson) used to pull the images.
  imagePullSecrets: []
  # auto = detect OpenShift; openshift / kubernetes = force it. On OpenShift the pods run
  # with the UID assigned by the restricted-v2 SCC.
  platform: auto
  # DNS domain of the cluster. Only change it if your cluster does not use cluster.local.
  clusterDomain: cluster.local
  # hard = never run two pods of the same component (ClickHouse, Keeper) on the same node
  #        (needs at least 3 nodes for Keeper).
  # soft = prefer different nodes, but allow sharing (small or test clusters).
  podAntiAffinity: hard
  # Run the pods only on nodes with these labels, e.g. {node-role.kubernetes.io/data: ""}.
  nodeSelector: {}
  # Tolerations for tainted nodes (Kubernetes format).
  tolerations: []
  tls:
    # How the TLS certificates are obtained:
    #   auto        - generated by Helm, signed by the CA in the Secret "<prefix>-ca"
    #                 (created by install.sh), and kept across upgrades.
    #   existing    - you provide the Secret (see clickhouse.tls below).
    #   certManager - cert-manager issues them, using global.tls.certManager. The issuer must
    #                 be a CA-type issuer (CA, Vault, ...) that fills "ca.crt" in the Secret:
    #                 ClickHouse and Keeper need it to verify each other. Without it the pods
    #                 stop at start with an explicit error.
    mode: auto
    # Name of the CA Secret (tls.crt/tls.key) used in auto mode. "" = "<prefix>-ca".
    caSecret: ""
    # auto mode: set to true once to issue new certificates on the next upgrade.
    regenerate: false
    # auto mode: validity of the generated certificates, in days.
    validityDays: 1825
    certManager:
      # Name of the cert-manager Issuer or ClusterIssuer (required in certManager mode).
      issuerName: ""
      # ClusterIssuer or Issuer.
      issuerKind: ClusterIssuer
      issuerGroup: cert-manager.io

# ---------------------------------------------------------------------------------
# ClickHouse
# ---------------------------------------------------------------------------------
clickhouse:
  # Only used by install.sh to decide whether to install this chart.
  enabled: true

  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3.35.3"
    pullPolicy: IfNotPresent

  # Number of ClickHouse servers. All of them hold a full copy of the data (one shard,
  # N replicas). 2 is the minimum for high availability.
  replicas: 2

  # Name of the ClickHouse cluster (remote_servers) that contains all the replicas.
  # Used by "ON CLUSTER" DDL and available as the {cluster} macro. "default" is also the
  # name of the cluster in ClickHouse Cloud. Cannot be changed after the first install.
  clusterName: default

  auth:
    # The CM MES administration user. It can create databases, tables, users, roles,
    # settings profiles, quotas and named collections (CM MES "Automatically provision
    # additional ClickHouse users" creates the other MES users with it).
    username: mes
    # "" = generated once and kept across upgrades (see the connection Secret).
    password: ""
    # Password of the built-in "default" user. That user only accepts connections from
    # inside the ClickHouse pods (localhost) and is meant for troubleshooting with
    # "kubectl exec <pod> -- clickhouse-client". "" = no password (still localhost only).
    defaultPassword: ""

  tls:
    # tls.mode=existing only: name of a Secret with tls.crt, tls.key and ca.crt, used by
    # both ClickHouse and Keeper. Its certificate must be valid for:
    #   <prefix>-clickhouse, <prefix>-clickhouse-headless, <prefix>-keeper-headless
    #   (short, .<ns>, .<ns>.svc and .<ns>.svc.<clusterDomain> names), plus
    #   *.<prefix>-clickhouse-headless.<ns>.svc.<clusterDomain> and
    #   *.<prefix>-keeper-headless.<ns>.svc.<clusterDomain>
    existingSecret: ""

  storage:
    # Data volume of each ClickHouse server. CM recommends at least 1Ti in production.
    size: 100Gi
    # "" = global.storageClass.
    storageClass: ""

  # CM minimum for ClickHouse: 4 vCPU and 16 GB RAM (recommended: 8 vCPU, 32 GB).
  # Keep the memory request equal to the limit: ClickHouse sizes its caches and its memory
  # limit from the container memory limit.
  # Open files: ClickHouse raises its soft limit to the hard limit of the container runtime
  # (containerd/CRI-O default 1048576). Kubernetes cannot set ulimits; if the runtime hard
  # limit is lower than 262144, raise it on the nodes (ClickHouse logs a warning otherwise).
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      memory: 16Gi

  # Server tuning.
  config:
    # Log level written to the container output: warning, information, debug, trace.
    logLevel: information
    # Fraction of the container memory limit that ClickHouse may use (queries, merges,
    # caches). The rest is headroom that protects the pod from being OOM-killed.
    maxServerMemoryUsageToRamRatio: 0.85
    # Maximum number of queries running at the same time (ClickHouse default).
    maxConcurrentQueries: 1000
    # Days kept in the system log tables (query_log, part_log, error_log, text_log, ...).
    systemLogTTLDays: 30
    # Days kept in the high-volume system tables (metric_log, asynchronous_metric_log,
    # trace_log, query_metric_log, ...).
    metricLogTTLDays: 7

  replication:
    # Where ReplicatedMergeTree tables created without arguments keep their metadata in Keeper.
    # Cannot be changed for existing tables. Trade-off between the two usual paths:
    #   /clickhouse/tables/{shard}/{database}/{table}  (default here)
    #     + works whether CM MES creates the table with or without ON CLUSTER
    #     - with a normal (delayed) DROP, the Keeper path is only removed after
    #       database_atomic_delay_before_drop_table_sec (480 s): re-creating a table with the
    #       same name in that window fails with REPLICA_ALREADY_EXISTS. synchronousDrop below
    #       removes that window.
    #   /clickhouse/tables/{uuid}/{shard}  (ClickHouse default)
    #     + every table gets a unique path, so drop/re-create is never a problem
    #     - CREATE TABLE ... ReplicatedMergeTree without ON CLUSTER is REJECTED by ClickHouse
    #       ("{uuid} macro is supported only for ON CLUSTER queries"). It is not known yet
    #       whether CM MES always uses ON CLUSTER, so this path is not the default.
    defaultReplicaPath: "/clickhouse/tables/{shard}/{database}/{table}"
    defaultReplicaName: "{replica}"
    # true = database_atomic_wait_for_drop_and_detach_synchronously=1 in the default profile:
    # every DROP/DETACH TABLE behaves like "DROP ... SYNC" and removes the table (and its
    # Keeper path) immediately, so the REPLICA_ALREADY_EXISTS window above does not exist.
    # Cost: a dropped table cannot be restored with UNDROP TABLE, and DROP of a big table
    # waits until its files are deleted.
    synchronousDrop: true

  # OPTIONAL. Databases to create with the Replicated database engine on every replica, e.g.
  # [MES, MESCDM, MESODS, MESDWH]. In a Replicated database every DDL statement (CREATE /
  # ALTER / DROP TABLE, views, ...) is replicated to all replicas, even without ON CLUSTER.
  # A post-install/post-upgrade Job creates them (as the MES admin user, over TLS) with
  #   CREATE DATABASE IF NOT EXISTS <name> ENGINE = Replicated('/clickhouse/databases/<name>', '{shard}', '{replica}')
  # and fails if a database with that name already exists with another engine (convert it
  # manually). Only use it if CM MES creates its tables without ON CLUSTER; inside these
  # databases ReplicatedMergeTree must be used without explicit arguments (ClickHouse rejects
  # explicit Keeper paths there unless database_replicated_allow_replicated_engine_arguments
  # is changed, e.g. with extraUsersConfig). Names: letters, digits and _. [] = none.
  replicatedDatabases: []

  # Expert settings: raw XML added inside <clickhouse>...</clickhouse> of the server
  # configuration (config.d) and of the users configuration (users.d). Example:
  #   extraConfig: |
  #     <max_table_size_to_drop>0</max_table_size_to_drop>
  # Do not put passwords in extraConfig (it is stored in a ConfigMap); extraUsersConfig is
  # stored in a Secret.
  extraConfig: ""
  extraUsersConfig: ""

  # Seconds given to ClickHouse to finish running queries and flush data when a pod stops.
  terminationGracePeriodSeconds: 120

  # Scheduling. Empty values use the global ones. A non-empty affinity replaces the default
  # anti-affinity (one ClickHouse server per node).
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # -------------------------------------------------------------------------------
  # ClickHouse Keeper (coordination service used for replication and distributed DDL)
  # -------------------------------------------------------------------------------
  keeper:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "26.3.35.3"
      pullPolicy: IfNotPresent

    # Number of Keeper servers. Must be odd: 3 tolerates the loss of one, 5 of two.
    replicas: 3

    storage:
      # Raft logs and snapshots of each Keeper server.
      size: 10Gi
      # "" = global.storageClass.
      storageClass: ""

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

    # Log level written to the container output: warning, information, debug, trace.
    logLevel: information

    # Expert settings: raw XML merged over the Keeper configuration, written inside
    # <clickhouse>...</clickhouse> (stored in a ConfigMap, so no passwords). Example:
    #   extraConfig: |
    #     <keeper_server><coordination_settings><snapshot_distance>50000</snapshot_distance></coordination_settings></keeper_server>
    extraConfig: ""

    terminationGracePeriodSeconds: 60

    # Scheduling. Empty values use the global ones. A non-empty affinity replaces the default
    # anti-affinity (one Keeper server per node).
    nodeSelector: {}
    tolerations: []
    affinity: {}

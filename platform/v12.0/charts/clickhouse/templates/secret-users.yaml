{{- /*
Passwords and the users configuration (users.d). Passwords never go into a ConfigMap:
users.xml below holds only SHA-256 hashes, and the server configuration reads the other
secrets from environment variables (from_env).
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $mesPassword := include "clickhouse.secret" (dict "ctx" . "key" "mes-password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.usersSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
  annotations:
    # Kept on "helm uninstall": these values protect data that outlives the release (Keeper
    # password, named-collection key, replica credentials, MES password). A reinstall with the
    # same release name adopts the Secret again and reuses the values (common.secretValue).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mes-username: {{ $ch.auth.username | quote }}
  mes-password: {{ $mesPassword | quote }}
  interserver-password: {{ include "clickhouse.secret" (dict "ctx" . "key" "interserver-password") | quote }}
  cluster-secret: {{ include "clickhouse.secret" (dict "ctx" . "key" "cluster-secret") | quote }}
  keeper-password: {{ include "clickhouse.secret" (dict "ctx" . "key" "keeper-password") | quote }}
  named-collections-seed: {{ include "clickhouse.secret" (dict "ctx" . "key" "named-collections-seed") | quote }}
  named-collections-key: {{ include "clickhouse.namedCollectionsKey" . | quote }}
  users.xml: |
    <?xml version="1.0"?>
    <!-- Generated by the cmmes clickhouse chart. Merged over the image's users.xml. -->
    <clickhouse>
        <profiles>
            <!-- Applied to every session (default_profile), including the users that CM MES creates. -->
            <default>
                <!-- Required by CM MES (see the CM MES ClickHouse requirements). -->
                <allow_materialized_view_with_bad_select>1</allow_materialized_view_with_bad_select>
                <!-- Users, roles, UDFs and named collections are already replicated through
                     Keeper: run their DDL once instead of once per replica when ON CLUSTER is used. -->
                <ignore_on_cluster_for_replicated_access_entities_queries>1</ignore_on_cluster_for_replicated_access_entities_queries>
                <ignore_on_cluster_for_replicated_udf_queries>1</ignore_on_cluster_for_replicated_udf_queries>
                <ignore_on_cluster_for_replicated_named_collections_queries>1</ignore_on_cluster_for_replicated_named_collections_queries>
                <!-- Replicated databases (clickhouse.replicatedDatabases) replicate their DDL themselves. -->
                <ignore_on_cluster_for_replicated_database>1</ignore_on_cluster_for_replicated_database>
                {{- if $ch.replication.synchronousDrop }}
                <!-- DROP/DETACH TABLE act immediately (as with SYNC), so a replicated table can be
                     re-created with the same name right away (clickhouse.replication.synchronousDrop). -->
                <database_atomic_wait_for_drop_and_detach_synchronously>1</database_atomic_wait_for_drop_and_detach_synchronously>
                {{- end }}
            </default>
        </profiles>
        <users>
            <!-- Built-in user: only reachable from inside the pod, for troubleshooting with
                 kubectl exec (clickhouse-client). It cannot manage users (no access_management).
                 No password unless clickhouse.auth.defaultPassword is set: whoever can exec into the
                 pod can already read the Keeper and interserver secrets from its environment. -->
            <default replace="replace">
                {{- with $ch.auth.defaultPassword }}
                <password_sha256_hex>{{ . | sha256sum }}</password_sha256_hex>
                {{- else }}
                <password></password>
                {{- end }}
                <networks>
                    <ip>::1</ip>
                    <ip>127.0.0.1</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
            </default>
            <!-- CM MES administration user: every privilege WITH GRANT OPTION, plus user,
                 role and named collection management. -->
            <{{ $ch.auth.username }}>
                <password_sha256_hex>{{ $mesPassword | sha256sum }}</password_sha256_hex>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>1</access_management>
                <named_collection_control>1</named_collection_control>
                <show_named_collections>1</show_named_collections>
                <show_named_collections_secrets>1</show_named_collections_secrets>
            </{{ $ch.auth.username }}>
        </users>
    {{- with $ch.extraUsersConfig }}
        <!-- clickhouse.extraUsersConfig -->
        {{- . | nindent 8 }}
    {{- end }}
    </clickhouse>

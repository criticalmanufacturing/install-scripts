{{- /*
ClickHouse Keeper configuration, mounted as /etc/clickhouse-keeper/config. Complete file (the
image default is not used); clickhouse.keeper.extraConfig is merged over it from keeper_config.d. server_id comes from the pod ordinal (KEEPER_SERVER_ID, set by the
container command) and the client password from the Secret (from_env).
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $keeper := $ch.keeper -}}
{{- $tls := "/etc/clickhouse-keeper/tls" -}}
{{- $data := "/var/lib/clickhouse-keeper" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.keeper.configMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "keeper") | nindent 4 }}
data:
  keeper_config.xml: |
    <?xml version="1.0"?>
    <!-- Generated by the cmmes clickhouse chart. -->
    <clickhouse>
        <!-- Logs go to the container output only (kubectl logs). -->
        <logger>
            <level>{{ include "clickhouse.xml" $keeper.logLevel }}</level>
            <console>1</console>
        </logger>

        <listen_host>::</listen_host>
        <listen_host>0.0.0.0</listen_host>
        <listen_try>1</listen_try>
        <max_connections>4096</max_connections>

        <keeper_server>
            <!-- Clients (ClickHouse servers): TLS only, with a password. -->
            <tcp_port_secure>9281</tcp_port_secure>
            <client_password from_env="KEEPER_CLIENT_PASSWORD"/>
            <server_id from_env="KEEPER_SERVER_ID"/>

            <storage_path>{{ $data }}</storage_path>
            <log_storage_path>{{ $data }}/coordination/log</log_storage_path>
            <snapshot_storage_path>{{ $data }}/coordination/snapshots</snapshot_storage_path>

            <coordination_settings>
                <operation_timeout_ms>10000</operation_timeout_ms>
                <session_timeout_ms>30000</session_timeout_ms>
                <raft_logs_level>warning</raft_logs_level>
            </coordination_settings>

            <!-- Read-only four-letter-word commands only. -->
            <four_letter_word_allow_list>ruok,mntr,srvr,stat,conf,cons,envi,dirs,isro,wchs,lgif,apiv</four_letter_word_allow_list>

            <!-- Readiness endpoint for Kubernetes: GET /ready returns 200 when this server
                 is part of a quorum with a leader, 503 otherwise. -->
            <http_control>
                <port>9182</port>
                <readiness>
                    <endpoint>/ready</endpoint>
                </readiness>
            </http_control>

            <!-- Raft between Keeper servers: TLS. Server N (1-based) is pod N-1. -->
            <raft_configuration>
                <secure>true</secure>
                {{- range $i := until (int $keeper.replicas) }}
                <server>
                    <id>{{ add $i 1 }}</id>
                    <hostname>{{ include "clickhouse.keeper.podFqdn" (dict "ctx" $ "index" $i) }}</hostname>
                    <port>9234</port>
                </server>
                {{- end }}
            </raft_configuration>
        </keeper_server>

        <!-- Plain HTTP Prometheus endpoint, in-cluster only (monitoring contract: port 9363). -->
        <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
        </prometheus>

        <openSSL>
            <!-- Client port and incoming Raft connections. Clients do not need a certificate. -->
            <server>
                <certificateFile>{{ $tls }}/tls.crt</certificateFile>
                <privateKeyFile>{{ $tls }}/tls.key</privateKeyFile>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
            </server>
            <!-- Outgoing Raft connections to the other Keeper servers: verified with the chart CA. -->
            <client>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>
    </clickhouse>
  {{- with $keeper.extraConfig }}
  # Merged over keeper_config.xml (mounted as keeper_config.d/90-extra.xml).
  90-extra.xml: |
    <?xml version="1.0"?>
    <!-- clickhouse.keeper.extraConfig -->
    <clickhouse>
        {{- . | nindent 8 }}
    </clickhouse>
  {{- end }}

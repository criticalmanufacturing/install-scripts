{{- if .Values.clickhouse.loadBalancer.enabled -}}
{{- /*
HAProxy configuration of the load balancer in front of the ClickHouse servers.
Failover, as recommended by CM: every request goes to <prefix>-clickhouse-0 while it is
healthy, otherwise to the first healthy server after it (HAProxy "backup" servers are used in
the order they are listed). No secrets here: the certificate is mounted from the TLS Secret.
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $lb := $ch.loadBalancer -}}
{{- $hc := $lb.healthCheck -}}
{{- $tls := "/etc/haproxy/tls" -}}
{{- $defaultServer := printf "check inter %ds fall %d rise %d observe layer4 error-limit 2 on-error mark-down tcp-ut 30s ssl verify required ca-file %s/ca.crt resolvers kube init-addr last,libc,none" (int $hc.intervalSeconds) (int $hc.fall) (int $hc.rise) $tls -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.lb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "clickhouse-lb") | nindent 4 }}
data:
  haproxy.cfg: |
    # Generated by the cmmes clickhouse chart.
    global
        log stdout format raw local0 info
        maxconn {{ int $lb.maxConnections }}
        nbthread 2
        # Long ClickHouse URLs (query parameters are sent in the URL) must fit in one buffer.
        tune.bufsize 65536
        # Requests still running when a pod stops get this long to finish.
        hard-stop-after 50s
        ssl-default-bind-options ssl-min-ver TLSv1.2
        ssl-default-server-options ssl-min-ver TLSv1.2
        ssl-server-verify required

    # Kubernetes DNS. The servers are re-resolved continuously: a restarted pod gets a new IP.
    resolvers kube
        parse-resolv-conf
        accepted_payload_size 8192
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s
        hold obsolete 30s

    # The certificate of the ClickHouse servers, which is also valid for this Service.
    crt-store
        load crt {{ $tls }}/tls.crt key {{ $tls }}/tls.key alias clickhouse

    defaults
        log global
        mode http
        # Log errors and server state changes only, not every request.
        option httplog
        option dontlog-normal
        option log-health-checks
        # A request that could not reach a server is sent to the next one. Only connection
        # failures are retried: the request never reached ClickHouse, so an INSERT is never
        # applied twice.
        retries 3
        retry-on conn-failure
        option redispatch
        timeout connect 5s
        timeout check 5s
        timeout queue 10s
        timeout http-request 30s
        # Same idle time as the keep_alive_timeout of ClickHouse (30 s).
        timeout http-keep-alive 30s
        timeout client {{ $lb.queryTimeout }}
        timeout server {{ $lb.queryTimeout }}
        # A server that vanished (crashed node, network cut) never answers. The requests waiting on
        # it get an error after about 30 s (the client can retry) instead of waiting for
        # "timeout server": TCP keepalive probes find it while a query runs, and "tcp-ut 30s" on
        # the servers (TCP_USER_TIMEOUT) while a request is being sent. A server that stops
        # normally still answers at the TCP level: its running queries can finish.
        option srvtcpka
        srvtcpka-idle 10s
        srvtcpka-intvl 5s
        srvtcpka-cnt 3

    # Probes of the pod (/healthz) and Prometheus metrics (/metrics), plain HTTP, in-cluster.
    frontend monitoring
        bind :9363
        monitor-uri /healthz
        http-request use-service prometheus-exporter if { path /metrics }

    # CM MES (HTTPS).
    frontend https
        bind :8443 ssl crt "@/clickhouse"
        # ClickHouse records the client address in system.query_log (forwarded_for).
        option forwardfor
        default_backend clickhouse_https

    backend clickhouse_https
        # /replicas_status (no authentication): 200 when the server runs and does not lag the
        # other replicas (min_relative_delay_to_close, 300 s of inserts), 503 otherwise.
        option httpchk
        http-check send meth GET uri /replicas_status ver HTTP/1.1 hdr Host clickhouse
        http-check expect status 200
        # The servers' certificate is verified against the pod name (sni, check-sni, verifyhost),
        # never against the Host header of the request.
        # observe layer4: a server that refuses connections from real traffic (e.g. a stopping
        # pod) is taken out at once, without waiting for the health checks. Only connection
        # errors count: query errors (HTTP 500) never trigger a failover.
        default-server {{ $defaultServer }}
        {{- range $i := until (int $ch.replicas) }}
        {{- $host := include "clickhouse.podFqdn" (dict "ctx" $ "index" $i) }}
        server clickhouse-{{ $i }} {{ $host }}:8443 sni str({{ $host }}) check-sni {{ $host }} verifyhost {{ $host }}{{ if gt $i 0 }} backup{{ end }}
        {{- end }}
    {{- if include "clickhouse.ro.enabled" . }}

    # Read-only endpoint (Service <prefix>-clickhouse-ro, HTTPS) for reporting, BI and ad-hoc
    # queries: the same chain in reverse order, so heavy reads go to the server that CM MES
    # does not use (the last one), and fall back to the others when it is down.
    frontend https_ro
        bind :8444 ssl crt "@/clickhouse"
        option forwardfor
        default_backend clickhouse_ro

    # Own health checks, same as clickhouse_https ("track" would not take a refusing server out
    # at once: observe layer4 needs the server's own checks).
    backend clickhouse_ro
        option httpchk
        http-check send meth GET uri /replicas_status ver HTTP/1.1 hdr Host clickhouse
        http-check expect status 200
        default-server {{ $defaultServer }}
        {{- $last := sub (int $ch.replicas) 1 }}
        {{- range $j := until (int $ch.replicas) }}
        {{- $i := sub $last $j }}
        {{- $host := include "clickhouse.podFqdn" (dict "ctx" $ "index" $i) }}
        server clickhouse-{{ $i }} {{ $host }}:8443 sni str({{ $host }}) check-sni {{ $host }} verifyhost {{ $host }}{{ if gt $j 0 }} backup{{ end }}
        {{- end }}
    {{- end }}

    # Native protocol (TLS passed through to the servers) for CM MES components that still use
    # it. Follows the health of the HTTPS servers above, so both ports use the same server.
    # Connections are long-lived: they are closed when their server fails, and moved back to
    # the primary when it is healthy again.
    frontend native
        mode tcp
        option tcplog
        bind :9440
        default_backend clickhouse_native

    backend clickhouse_native
        mode tcp
        default-server resolvers kube init-addr last,libc,none on-marked-down shutdown-sessions
        {{- range $i := until (int $ch.replicas) }}
        server clickhouse-{{ $i }} {{ include "clickhouse.podFqdn" (dict "ctx" $ "index" $i) }}:9440 track clickhouse_https/clickhouse-{{ $i }}{{ if gt $i 0 }} backup{{ else }} on-marked-up shutdown-backup-sessions{{ end }}
        {{- end }}
{{- end }}

{{- /*
helm test: as the MES user, query the Service over HTTPS (8443) a few times (with the load
balancer they must all reach the same server) and the read-only endpoint (it must reach another
server); then, over native TLS (9440) with the chart CA, create a
ReplicatedMergeTree table ON CLUSTER in a temporary database, insert a row through the
first replica, check that every replica returns it, then drop the database.
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $uid := int (include "clickhouse.uid" .) -}}
{{- $hosts := list -}}
{{- range $i := until (int $ch.replicas) -}}
{{- $hosts = append $hosts (include "clickhouse.podFqdn" (dict "ctx" $ "index" $i)) -}}
{{- end -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "common.fullname" (dict "ctx" . "component" "clickhouse-test") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "clickhouse-test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- include "common.imagePullSecrets" . | nindent 2 }}
  {{- include "common.podSecurityContext" (dict "ctx" . "uid" $uid "gid" $uid) | nindent 2 }}
  {{- include "common.scheduling" (dict "ctx" . "nodeSelector" $ch.nodeSelector "tolerations" $ch.tolerations) | nindent 2 }}
  containers:
    - name: test
      image: {{ include "common.image" (dict "ctx" . "image" $ch.image) }}
      imagePullPolicy: {{ $ch.image.pullPolicy | default "IfNotPresent" }}
      {{- include "common.containerSecurityContext" . | nindent 6 }}
      env:
        - name: HOME
          value: /tmp
        - name: SERVICE
          value: {{ include "common.svcFqdn" (dict "ctx" . "name" (include "clickhouse.fullname" .)) | quote }}
        - name: REPLICAS
          value: {{ join " " $hosts | quote }}
        {{- if include "clickhouse.ro.enabled" . }}
        - name: RO_SERVICE
          value: {{ include "common.svcFqdn" (dict "ctx" . "name" (include "clickhouse.ro.fullname" .)) | quote }}
        {{- end }}
        - name: CLUSTER
          value: {{ $ch.clusterName | quote }}
        - name: CH_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "clickhouse.usersSecret" . }}
              key: mes-username
        - name: CH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "clickhouse.usersSecret" . }}
              key: mes-password
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          q() {
            local host="$1"; shift
            clickhouse-client --config-file=/etc/cmmes/client.xml --secure --host "$host" --port 9440 \
              --user "$CH_USER" --password "$CH_PASSWORD" --query "$*"
          }
          db="cmmes_helm_test_$(date +%s)_${RANDOM}"
          cleanup() {
            q "$SERVICE" "DROP DATABASE IF EXISTS ${db} ON CLUSTER ${CLUSTER} SYNC" >/dev/null || true
          }
          trap cleanup EXIT

          # HTTPS through the Service, verifying its certificate against the chart CA.
          cat >/tmp/local.xml <<'EOF'
          <clickhouse><openSSL><client>
            <caConfig>/etc/clickhouse-server/tls/ca.crt</caConfig>
            <verificationMode>strict</verificationMode>
            <loadDefaultCAFile>false</loadDefaultCAFile>
            <invalidCertificateHandler><name>RejectCertificateHandler</name></invalidCertificateHandler>
          </client></openSSL></clickhouse>
          EOF
          https_host() {
            clickhouse local --config-file=/tmp/local.xml --query "SELECT * FROM url(
              'https://${1:-$SERVICE}:8443/?query=SELECT%20hostName()', 'TSV', 'h String',
              headers('X-ClickHouse-User' = '${CH_USER}', 'X-ClickHouse-Key' = '${CH_PASSWORD//\'/\\\'}'))"
          }
          echo "Connecting to ${SERVICE}:8443 (HTTPS) as ${CH_USER}"
          servers=""
          for i in 1 2 3 4 5; do servers="${servers} $(https_host)"; done
          echo "Answered by:${servers}"
          {{- if $ch.loadBalancer.enabled }}
          # Failover load balancer: every request goes to the same server.
          if [ "$(printf '%s\n' ${servers} | sort -u | wc -l)" != "1" ]; then
            echo "FAILED: the load balancer sent the requests to different servers" >&2
            exit 1
          fi
          {{- end }}
          {{- if include "clickhouse.ro.enabled" . }}

          # Read-only endpoint: reverse order, so it uses another server than CM MES.
          echo "Connecting to ${RO_SERVICE}:8443 (HTTPS, read-only endpoint) as ${CH_USER}"
          ro="$(https_host "$RO_SERVICE")"
          echo "Answered by: ${ro}"
          {{- if gt (int $ch.replicas) 1 }}
          if [ "$ro" = "$(https_host)" ]; then
            echo "FAILED: the read-only endpoint uses the same server as CM MES (${ro})" >&2
            exit 1
          fi
          {{- end }}
          {{- end }}

          echo "Connecting to ${SERVICE}:9440 (native TLS) as ${CH_USER}"
          q "$SERVICE" "SELECT 'ClickHouse ' || version() || ' on ' || hostName()"

          echo "Creating ${db}.t (ReplicatedMergeTree) ON CLUSTER ${CLUSTER}"
          q "$SERVICE" "CREATE DATABASE ${db} ON CLUSTER ${CLUSTER}"
          q "$SERVICE" "CREATE TABLE ${db}.t ON CLUSTER ${CLUSTER} (id UInt64, v String) ENGINE = ReplicatedMergeTree ORDER BY id"

          first="${REPLICAS%% *}"
          echo "Inserting one row through ${first}"
          q "$first" "INSERT INTO ${db}.t VALUES (1, 'cmmes')"

          for host in ${REPLICAS}; do
            q "$host" "SYSTEM SYNC REPLICA ${db}.t"
            rows="$(q "$host" "SELECT count() FROM ${db}.t WHERE id = 1 AND v = 'cmmes'")"
            if [ "$rows" != "1" ]; then
              echo "FAILED: ${host} returned ${rows} rows instead of 1" >&2
              exit 1
            fi
            echo "OK: ${host} has the row"
          done

          q "$SERVICE" "DROP DATABASE ${db} ON CLUSTER ${CLUSTER} SYNC"
          trap - EXIT
          echo "ClickHouse replication test passed"
      volumeMounts:
        - name: client-config
          mountPath: /etc/cmmes
          readOnly: true
        - name: ca
          mountPath: /etc/clickhouse-server/tls
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: client-config
      configMap:
        name: {{ include "clickhouse.configMap" . }}
        items:
          - {key: client.xml, path: client.xml}
    - name: ca
      secret:
        secretName: {{ include "clickhouse.tlsSecret" . }}
        items:
          - {key: ca.crt, path: ca.crt}
    - name: tmp
      emptyDir: {}

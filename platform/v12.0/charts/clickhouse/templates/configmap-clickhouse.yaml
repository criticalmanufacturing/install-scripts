{{- /*
ClickHouse server configuration, mounted as /etc/clickhouse-server/config.d and merged over
the image's config.xml. No secrets here: they come from environment variables (from_env).
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $cfg := $ch.config -}}
{{- $tls := "/etc/clickhouse-server/tls" -}}
{{- $ttl := int $cfg.systemLogTTLDays -}}
{{- $metricTtl := int $cfg.metricLogTTLDays -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.configMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
data:
  00-cmmes.xml: |
    <?xml version="1.0"?>
    <!-- Generated by the cmmes clickhouse chart. Merged over /etc/clickhouse-server/config.xml. -->
    <clickhouse>
        <!-- Logs go to the container output only (kubectl logs). No log files. -->
        <logger>
            <level>{{ include "clickhouse.xml" $cfg.logLevel }}</level>
            <console>1</console>
            <log remove="remove"/>
            <errorlog remove="remove"/>
        </logger>

        <timezone>UTC</timezone>

        <!-- Listen on all addresses, IPv6 and IPv4. listen_try: a missing address family
             (e.g. IPv6 disabled on the node) is not an error. -->
        <listen_host>::</listen_host>
        <listen_host>0.0.0.0</listen_host>
        <listen_try>1</listen_try>

        <!-- Clients: TLS only. The plain-text ports of the image are removed. -->
        <http_port remove="remove"/>
        <tcp_port remove="remove"/>
        <mysql_port remove="remove"/>
        <postgresql_port remove="remove"/>
        <https_port>8443</https_port>
        <tcp_port_secure>9440</tcp_port_secure>

        <!-- Replication between replicas (part fetches): TLS, authenticated. -->
        <interserver_http_port remove="remove"/>
        <interserver_https_port>9010</interserver_https_port>
        <interserver_https_host from_env="CLICKHOUSE_INTERSERVER_HOST"/>
        <interserver_http_credentials>
            <user>interserver</user>
            <password from_env="CLICKHOUSE_INTERSERVER_PASSWORD"/>
        </interserver_http_credentials>

        <!-- Plain HTTP Prometheus endpoint, in-cluster only (monitoring contract: port 9363). -->
        <prometheus>
            <endpoint>/metrics</endpoint>
            <port>9363</port>
            <metrics>true</metrics>
            <events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics>
            <errors>true</errors>
        </prometheus>

        <openSSL>
            <!-- Native TLS, HTTPS and interserver HTTPS. Clients do not need a certificate. -->
            <server>
                <certificateFile>{{ $tls }}/tls.crt</certificateFile>
                <privateKeyFile>{{ $tls }}/tls.key</privateKeyFile>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </server>
            <!-- Outgoing TLS: Keeper, other replicas (interserver, distributed queries) and
                 external HTTPS/S3 endpoints. Trusts the chart CA and the system CAs. -->
            <client>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>true</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>

        <!-- Memory limit: a fraction of the container memory limit (cgroup). -->
        <max_server_memory_usage_to_ram_ratio>{{ $cfg.maxServerMemoryUsageToRamRatio }}</max_server_memory_usage_to_ram_ratio>
        <max_concurrent_queries>{{ int $cfg.maxConcurrentQueries }}</max_concurrent_queries>
        <!-- mlockall needs CAP_IPC_LOCK, which the pod does not have. -->
        <mlock_executable>false</mlock_executable>

        <!-- Keeper ensemble (TLS client port 9281, password authentication). -->
        <zookeeper>
            {{- range $i := until (int $ch.keeper.replicas) }}
            <node index="{{ add $i 1 }}">
                <host>{{ include "clickhouse.keeper.podFqdn" (dict "ctx" $ "index" $i) }}</host>
                <port>9281</port>
                <secure>1</secure>
            </node>
            {{- end }}
            <session_timeout_ms>30000</session_timeout_ms>
            <operation_timeout_ms>10000</operation_timeout_ms>
            <password from_env="CLICKHOUSE_KEEPER_PASSWORD"/>
        </zookeeper>

        <!-- One shard with every replica. {replica} is the pod name. -->
        <macros>
            <cluster>{{ $ch.clusterName }}</cluster>
            <shard>1</shard>
            <replica from_env="CLICKHOUSE_REPLICA"/>
        </macros>
        <default_replica_path>{{ include "clickhouse.xml" $ch.replication.defaultReplicaPath }}</default_replica_path>
        <default_replica_name>{{ include "clickhouse.xml" $ch.replication.defaultReplicaName }}</default_replica_name>

        <!-- The cluster used by ON CLUSTER DDL and Distributed tables (replaces the image's
             test clusters). Distributed queries between replicas are authenticated by the
             shared secret and run as the initial user. -->
        <remote_servers replace="replace">
            <{{ $ch.clusterName }}>
                <secret from_env="CLICKHOUSE_CLUSTER_SECRET"/>
                <shard>
                    <internal_replication>true</internal_replication>
                    {{- range $i := until (int $ch.replicas) }}
                    <replica>
                        <host>{{ include "clickhouse.podFqdn" (dict "ctx" $ "index" $i) }}</host>
                        <port>9440</port>
                        <secure>1</secure>
                    </replica>
                    {{- end }}
                </shard>
            </{{ $ch.clusterName }}>
        </remote_servers>

        <distributed_ddl>
            <path>/clickhouse/task_queue/ddl</path>
            <replicas_path>/clickhouse/task_queue/replicas</replicas_path>
        </distributed_ddl>

        <!-- Users, roles, grants, settings profiles and quotas created with SQL (e.g. the
             users that CM MES provisions) are stored in Keeper, so every replica has them.
             Users from users.xml/users.d (the MES admin user) are read-only. -->
        <user_directories replace="replace">
            <users_xml>
                <path>users.xml</path>
            </users_xml>
            <replicated>
                <zookeeper_path>/clickhouse/access</zookeeper_path>
            </replicated>
        </user_directories>

        <!-- SQL user-defined functions and named collections are also shared through Keeper
             (named collections encrypted with AES-128). -->
        <user_defined_zookeeper_path>/clickhouse/user_defined</user_defined_zookeeper_path>
        <named_collections_storage>
            <type>keeper_encrypted</type>
            <path>/clickhouse/named_collections</path>
            <algorithm>aes_128_ctr</algorithm>
            <key_hex from_env="CLICKHOUSE_NAMED_COLLECTIONS_KEY"/>
            <update_timeout_ms>5000</update_timeout_ms>
        </named_collections_storage>

        <!-- Retention of the system log tables, so that they do not fill the disk. -->
        {{- range $table := list "query_log" "query_views_log" "part_log" "error_log" "backup_log" "s3queue_log" "background_schedule_pool_log" }}
        <{{ $table }}>
            <ttl>event_date + INTERVAL {{ $ttl }} DAY DELETE</ttl>
        </{{ $table }}>
        {{- end }}
        {{- range $table := list "metric_log" "asynchronous_metric_log" "trace_log" "query_thread_log" "query_metric_log" "processors_profile_log" }}
        <{{ $table }}>
            <ttl>event_date + INTERVAL {{ $metricTtl }} DAY DELETE</ttl>
        </{{ $table }}>
        {{- end }}
        <text_log>
            <ttl>event_date + INTERVAL {{ $ttl }} DAY DELETE</ttl>
            <level>{{ include "clickhouse.xml" $cfg.logLevel }}</level>
        </text_log>
    </clickhouse>
  {{- with $ch.extraConfig }}
  90-extra.xml: |
    <?xml version="1.0"?>
    <!-- clickhouse.extraConfig -->
    <clickhouse>
        {{- . | nindent 8 }}
    </clickhouse>
  {{- end }}
  # clickhouse-client inside the pods and in the helm test: TLS, trusting the chart CA.
  client.xml: |
    <?xml version="1.0"?>
    <config>
        <secure>true</secure>
        <port>9440</port>
        <openSSL>
            <client>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>
    </config>

# Default values for the S3 chart (Critical Manufacturing MES v12 dependencies).
#
# install.sh passes one values file to every chart. This chart reads only "global", "s3"
# and "observability.otlpEndpoint"; everything else is ignored. The defaults below are
# production defaults: most administrators only change the storage size and, if needed,
# the StorageClass.
#
# Two providers are supported (s3.provider):
#   rustfs - this chart deploys a distributed, erasure-coded RustFS cluster (default).
#   rgw    - use an existing Ceph Object Gateway: OpenShift Data Foundation
#            ("ocs-storagecluster-ceph-rgw") or Rook-Ceph. The chart only creates an
#            ObjectBucketClaim; Ceph creates the bucket and its credentials.
#            NooBaa ("openshift-storage.noobaa.io") is NOT supported.

# ---------------------------------------------------------------------------------
# Settings shared by all the dependency charts.
# ---------------------------------------------------------------------------------
global:
  # Prefix of every resource name, e.g. "cmmes" gives the StatefulSet "cmmes-s3".
  namePrefix: cmmes
  # StorageClass for the persistent volumes. "" = the cluster default StorageClass.
  storageClass: ""
  # Private registry/mirror put in front of every image, e.g. "registry.example.com/mirror".
  # "" = pull from Docker Hub.
  imageRegistry: ""
  # Names of Secrets (type kubernetes.io/dockerconfigjson) used to pull the images.
  imagePullSecrets: []
  # auto = detect OpenShift; openshift / kubernetes = force it. On OpenShift the pods run
  # with the UID assigned by the restricted-v2 SCC.
  platform: auto
  # DNS domain of the cluster. Only change it if your cluster does not use cluster.local.
  clusterDomain: cluster.local
  # hard = never run two RustFS pods on the same node (needs at least s3.rustfs.replicas
  #        nodes, 3 by default).
  # soft = prefer different nodes, but allow sharing (small or test clusters). Pods are
  #        then spread evenly, but losing a node that runs two pods stops the S3 service.
  podAntiAffinity: hard
  # Run the pods only on nodes with these labels, e.g. {node-role.kubernetes.io/data: ""}.
  nodeSelector: {}
  # Tolerations for tainted nodes (Kubernetes format).
  tolerations: []
  tls:
    # How the TLS certificates are obtained:
    #   auto        - generated by Helm, signed by the CA in the Secret "<prefix>-ca"
    #                 (created by install.sh), and kept across upgrades.
    #   existing    - you provide the Secret (see s3.rustfs.tls below).
    #   certManager - cert-manager issues it, using global.tls.certManager.
    mode: auto
    # Name of the CA Secret (tls.crt/tls.key) used in auto mode. "" = "<prefix>-ca".
    caSecret: ""
    # auto mode: set to true once to issue new certificates on the next upgrade.
    regenerate: false
    # auto mode: validity of the generated certificates, in days.
    validityDays: 1825
    certManager:
      # Name of the cert-manager Issuer or ClusterIssuer (required in certManager mode).
      issuerName: ""
      # ClusterIssuer or Issuer.
      issuerKind: ClusterIssuer
      issuerGroup: cert-manager.io

# ---------------------------------------------------------------------------------
# S3 storage
# ---------------------------------------------------------------------------------
s3:
  # Only used by install.sh to decide whether to install this chart.
  enabled: true

  # rustfs (deploy RustFS) or rgw (bucket on an existing Ceph Object Gateway).
  provider: rustfs

  # Bucket used by CM MES. S3 naming rules: 3-63 characters, lowercase letters, digits,
  # dots and hyphens. With provider=rgw this is only a prefix: Ceph appends a random
  # suffix, and the real name is published in the ConfigMap "<prefix>-s3" (BUCKET_NAME).
  bucket: cm-mes

  # -------------------------------------------------------------------------------
  # provider: rustfs
  # -------------------------------------------------------------------------------
  rustfs:
    image:
      # Repository without registry host (global.imageRegistry is put in front of it).
      repository: rustfs/rustfs
      tag: "1.0.0"
      pullPolicy: IfNotPresent

    # Number of RustFS pods (one per node with podAntiAffinity=hard) and number of
    # volumes (drives) per pod. All the drives form one erasure-coded set:
    #   drives = replicas x volumesPerPod   (default 3 x 2 = 6, allowed 4..16)
    # The chart refuses combinations where losing one pod stops writes (see "parity").
    # Never change replicas, volumesPerPod or parity after the first install: RustFS
    # keeps the drive layout on disk. Growing needs a new server pool (manual procedure).
    replicas: 3
    volumesPerPod: 2

    # Erasure-coding parity: how many drives of the set can be lost. Each object is split
    # into (drives - parity) data shards plus "parity" parity shards, one per drive.
    #   read quorum  = drives - parity
    #   write quorum = drives - parity (+1 when data shards == parity shards)
    # Default 6 drives with parity 2 (EC 4+2): losing one pod (2 drives) leaves 4 drives,
    # which still meets the read quorum (4) and the write quorum (4). Usable capacity is
    # 4/6 of the raw capacity. Parity 3 (EC 3+3) survives one pod plus one more drive for
    # reads, but only gives 1/2 of the raw capacity.
    parity: 2

    storage:
      # Size of EACH volume. Raw capacity = replicas x volumesPerPod x size
      # (default 6 x 100Gi = 600Gi raw, about 400Gi usable with parity 2).
      size: 100Gi
      # StorageClass for these volumes. "" = global.storageClass.
      # Use block storage that gives every volume its own disk (Ceph RBD, EBS, Azure Disk,
      # vSphere, Longhorn...). RustFS refuses to start when two volumes of a pod are on the
      # same physical disk (see allowSharedDisks).
      storageClass: ""

    # RustFS refuses two drives of a pod on the same physical disk (for example
    # local-path/hostPath provisioners, or LVM volumes on one disk), because one disk
    # failure would then take several drives. true disables that safety check
    # (RUSTFS_UNSAFE_BYPASS_DISK_CHECK). Only for test clusters.
    allowSharedDisks: false

    auth:
      # Root (administrator) credentials of RustFS. Leave empty to generate random ones,
      # which are kept in the Secret "<prefix>-s3-credentials" across upgrades.
      # Do not change them after the first install.
      rootUser: ""
      rootPassword: ""

    # Dedicated MES user, allowed to use only the bucket "s3.bucket" (everything except
    # deleting the bucket or changing its policy) and to list bucket names. Created or
    # updated by the post-install/post-upgrade Job through the RustFS admin API.
    # enabled=false: MES uses the root credentials instead.
    mesUser:
      enabled: true
      # Leave empty to generate them (kept in "<prefix>-s3-credentials").
      accessKey: ""
      secretKey: ""

    # Keep old versions of overwritten/deleted objects. Off by default: MES does not need
    # it and every overwrite would keep using space until a lifecycle rule removes it.
    # Once enabled, versioning can only be suspended, not removed.
    versioning: false

    # Region reported by RustFS (clients sign requests with it).
    region: us-east-1

    tls:
      # global.tls.mode=existing: name of a Secret with tls.crt, tls.key and ca.crt.
      # The certificate must include these DNS names (ns = release namespace):
      #   <prefix>-s3, <prefix>-s3.<ns>, <prefix>-s3.<ns>.svc, <prefix>-s3.<ns>.svc.<clusterDomain>
      #   *.<prefix>-s3-headless.<ns>.svc.<clusterDomain>   (RustFS pods talk to each other over TLS)
      existingSecret: ""

    # Web console (port 9001, HTTPS). Disabled by default: MES does not need it. When
    # enabled, it is exposed only inside the cluster (Service "<prefix>-s3-console");
    # use "kubectl port-forward svc/<prefix>-s3-console 9001" and log in with the root user.
    console:
      enabled: false

    # Telemetry sent to the local OpenTelemetry collector ("<prefix>-otel", installed when
    # observability.otlpEndpoint is set). Only used when observability.otlpEndpoint is set.
    telemetry:
      metrics: true
      traces: false
      logs: false         # false = logs only go to the container output (kubectl logs)
      # Metrics export interval, in seconds.
      interval: 30

    # Log level: error, warn, info, debug.
    logLevel: info

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi

    # Time given to RustFS to finish in-flight requests on shutdown.
    terminationGracePeriodSeconds: 60

    # Scheduling. Empty = use the global values.
    nodeSelector: {}
    tolerations: []
    # Custom affinity (Kubernetes format). Empty = one pod per node (global.podAntiAffinity).
    affinity: {}
    # Extra annotations for the RustFS pods.
    podAnnotations: {}
    # Extra environment variables for RustFS, e.g. [{name: RUSTFS_SCANNER_SPEED, value: slow}]
    extraEnv: []

  # Image used by the bucket-setup Job and by "helm test".
  awsCli:
    image:
      repository: amazon/aws-cli
      tag: "2.37.4"
      pullPolicy: IfNotPresent

  # -------------------------------------------------------------------------------
  # provider: rgw
  # -------------------------------------------------------------------------------
  rgw:
    # StorageClass of the Ceph RGW bucket provisioner:
    #   OpenShift Data Foundation: ocs-storagecluster-ceph-rgw
    #   Rook-Ceph: the StorageClass you created for your CephObjectStore
    storageClass: ocs-storagecluster-ceph-rgw
    # Extra provisioner options (ObjectBucketClaim spec.additionalConfig),
    # e.g. {maxSize: "500G", maxObjects: "10000000"}
    additionalConfig: {}
    # CA used by "helm test" when the gateway uses HTTPS (port 443 or 8443).
    # Default: the OpenShift service CA, published in every namespace. On Rook, put the CA
    # that signed the RGW certificate in a ConfigMap and set its name and key here.
    ca:
      configMap: openshift-service-ca.crt
      key: service-ca.crt

# Only "otlpEndpoint" is read by this chart: when it is set, RustFS sends its metrics to the
# local OpenTelemetry collector "<prefix>-otel" (charts/otel), which forwards them.
observability:
  otlpEndpoint: ""

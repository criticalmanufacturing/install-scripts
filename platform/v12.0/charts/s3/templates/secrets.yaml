{{- if eq (include "s3.provider" .) "rustfs" }}
{{- include "s3.rustfs.validate" . }}
# RustFS root credentials and the MES user credentials. Kept on uninstall: the RustFS
# volumes (and their IAM data) survive an uninstall and need the same root credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3.credentialsSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "s3") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  root-access-key: {{ include "s3.rootAccessKey" . | b64enc | quote }}
  root-secret-key: {{ include "s3.rootSecretKey" . | b64enc | quote }}
  {{- if .Values.s3.rustfs.mesUser.enabled }}
  mes-access-key: {{ include "s3.mesAccessKey" . | b64enc | quote }}
  mes-secret-key: {{ include "s3.mesSecretKey" . | b64enc | quote }}
  {{- end }}
{{- end }}

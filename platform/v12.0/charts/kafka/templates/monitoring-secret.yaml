{{- /*
Monitoring contract (DEVELOPMENT.md): how the OpenTelemetry kafkametrics receiver
connects as the read-only "monitor" principal.
  bootstrap, protocol, and username/password when protocol=SASL_SSL.
No certificates are copied here. charts/otel mounts them directly:
  CA:                 common.tls.secretName (component "kafka", existingSecret kafka.tls.existingSecret), key ca.crt
  monitor cert (SSL): common.tls.secretName (component "kafka-monitor", existingSecret kafka.tls.existingMonitorSecret), keys tls.crt/tls.key
*/ -}}
{{- $monitorAuth := include "kafka.monitor.auth" . -}}
{{- $bootstrap := include "kafka.brokerList" (dict "ctx" . "port" (include "kafka.port.client" .)) -}}
{{- $data := dict "protocol" "SSL" -}}
{{- if eq $monitorAuth "sasl" -}}
{{- $_ := set $data "protocol" "SASL_SSL" -}}
{{- if eq (include "kafka.authMethod" .) "mtls" -}}
{{- /* The CLIENT listener only accepts certificates: use the INTERNAL listener. */ -}}
{{- $bootstrap = include "kafka.brokerList" (dict "ctx" . "port" (include "kafka.port.internal" .)) -}}
{{- end -}}
{{- $_ := set $data "username" "monitor" -}}
{{- $_ := set $data "password" (include "kafka.password" (dict "ctx" . "user" "monitor")) -}}
{{- end -}}
{{- $_ := set $data "bootstrap" $bootstrap -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.monitoringSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "kafka") | nindent 4 }}
type: Opaque
data:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k | b64enc | quote }}
  {{- end }}

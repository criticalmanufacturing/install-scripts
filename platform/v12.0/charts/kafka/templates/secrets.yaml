{{- $kraft := include "kafka.kraft" . | fromJson -}}
# Passwords of the Kafka users on the internal listeners (SASL/PLAIN). Stable across
# upgrades, and kept on "helm uninstall" so that a reinstall finds the same passwords.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.usersSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "kafka") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "kafka.password" (dict "ctx" . "user" "admin") | b64enc }}
  monitor-password: {{ include "kafka.password" (dict "ctx" . "user" "monitor") | b64enc }}
---
# KRaft identity. It must never change for the lifetime of the data volumes, so it is
# kept on "helm uninstall" (like the volumes) and reused on reinstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.kraftSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "kafka") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cluster-id: {{ $kraft.clusterId | b64enc }}
  initial-controllers: {{ $kraft.initialControllers | b64enc }}

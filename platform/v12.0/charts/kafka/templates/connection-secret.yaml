{{- /*
Values to type in the CM MES installer (printed by install.sh).
install.sh saves ca.crt of the broker TLS Secret as "kafka-ca.crt" and, for mTLS, the
listed files of the MES client certificate Secret as "kafka-<key>".
*/ -}}
{{- $auth := include "kafka.authMethod" . -}}
{{- $fields := list (list "Bootstrap Servers" (include "kafka.brokerList" (dict "ctx" . "port" (include "kafka.port.client" .)))) -}}
{{- if eq $auth "sasl" -}}
{{- $fields = concat $fields (list
      (list "Authentication Method" "SASL_SSL Plain")
      (list "Kafka Username" "mes")
      (list "Kafka Password" (include "kafka.password" (dict "ctx" . "user" "mes")))
      (list "Ssl Certificate Authority" "kafka-ca.crt")) -}}
{{- else -}}
{{- $fields = concat $fields (list
      (list "Authentication Method" "mTLS")
      (list "Ssl Certificate Authority" "kafka-ca.crt")
      (list "Ssl Certificate" "kafka-tls.crt")
      (list "Ssl Key" "kafka-tls.key")) -}}
{{- end -}}
{{- $fields = append $fields (list "Validate certificates" "true") -}}
{{- $args := dict "ctx" . "component" "kafka" "title" "Kafka" "order" "10" "caSecret" (include "kafka.tls.brokerSecret" .) "fields" $fields -}}
{{- if eq $auth "mtls" -}}
{{- $_ := set $args "files" (list "tls.crt" "tls.key") -}}
{{- $_ := set $args "filesSecret" (include "kafka.tls.clientSecret" .) -}}
{{- end -}}
{{ include "common.connectionSecret" $args }}

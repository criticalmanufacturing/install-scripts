{{- /*
Values to type in the CM MES installer (printed by install.sh).
install.sh saves ca.crt of the broker TLS Secret as "kafka-ca.crt" and the listed files of
the MES client certificate Secret as "kafka-<key>".
*/ -}}
{{- $fields := list
      (list "Bootstrap Servers" (include "kafka.brokerList" (dict "ctx" . "port" (include "kafka.port.client" .))))
      (list "Authentication Method" "mTLS")
      (list "Ssl Certificate Authority" "kafka-ca.crt")
      (list "Ssl Certificate" "kafka-tls.crt")
      (list "Ssl Key" "kafka-tls.key")
      (list "Validate certificates" "true") -}}
{{ include "common.connectionSecret" (dict "ctx" . "component" "kafka" "title" "Kafka" "order" "10" "caSecret" (include "kafka.tls.brokerSecret" .) "fields" $fields "files" (list "tls.crt" "tls.key") "filesSecret" (include "kafka.tls.clientSecret" .)) }}

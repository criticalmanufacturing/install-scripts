# Default values for the Kafka chart (Critical Manufacturing MES v12 dependencies).
#
# install.sh passes one values file to every chart. This chart reads only "global"
# and "kafka"; everything else is ignored. The defaults below are production defaults:
# most administrators only change the storage size and, if needed, the StorageClass.

# ---------------------------------------------------------------------------------
# Settings shared by all the dependency charts.
# ---------------------------------------------------------------------------------
global:
  # Prefix of every resource name, e.g. "cmmes" gives the StatefulSet "cmmes-kafka".
  namePrefix: cmmes
  # StorageClass for the persistent volumes. "" = the cluster default StorageClass.
  storageClass: ""
  # Private registry/mirror put in front of every image, e.g. "registry.example.com/mirror".
  # "" = pull from Docker Hub.
  imageRegistry: ""
  # Names of Secrets (type kubernetes.io/dockerconfigjson) used to pull the images.
  imagePullSecrets: []
  # auto = detect OpenShift; openshift / kubernetes = force it. On OpenShift the pods run
  # with the UID assigned by the restricted-v2 SCC.
  platform: auto
  # DNS domain of the cluster. Only change it if your cluster does not use cluster.local.
  clusterDomain: cluster.local
  # hard = never run two Kafka pods on the same node (needs at least 3 nodes).
  # soft = prefer different nodes, but allow sharing (small or test clusters).
  podAntiAffinity: hard
  # Run the pods only on nodes with these labels, e.g. {node-role.kubernetes.io/data: ""}.
  nodeSelector: {}
  # Tolerations for tainted nodes (Kubernetes format).
  tolerations: []
  tls:
    # How the TLS certificates are obtained:
    #   auto        - generated by Helm, signed by the CA in the Secret "<prefix>-ca"
    #                 (created by install.sh), and kept across upgrades.
    #   existing    - you provide the Secrets (see kafka.tls below).
    #   certManager - cert-manager issues them, using global.tls.certManager.
    mode: auto
    # Name of the CA Secret (tls.crt/tls.key) used in auto mode. "" = "<prefix>-ca".
    caSecret: ""
    # auto mode: set to true once to issue new certificates on the next upgrade.
    regenerate: false
    # auto mode: validity of the generated certificates, in days.
    validityDays: 1825
    certManager:
      # Name of the cert-manager Issuer or ClusterIssuer (required in certManager mode).
      # It must be a CA-type issuer (e.g. "ca", or Vault with the CA chain) that fills
      # ca.crt in the issued Secrets: Kafka and its clients need it. Without ca.crt the
      # Kafka pods stop at start with an explicit error.
      issuerName: ""
      # ClusterIssuer or Issuer.
      issuerKind: ClusterIssuer
      issuerGroup: cert-manager.io

# ---------------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------------
kafka:
  # Only used by install.sh to decide whether to install this chart.
  enabled: true

  # Number of Kafka servers. Every server is both a broker and a KRaft controller, so
  # use an odd number: 3 (tolerates 1 server down) or 5 (tolerates 2).
  # Changing it after the first install needs manual KRaft steps (see the chart notes).
  replicas: 3

  image:
    # Repository without registry host (global.imageRegistry is put in front of it).
    repository: apache/kafka
    tag: "4.3.1"
    pullPolicy: IfNotPresent

  # KRaft cluster id. Leave empty: a valid id is generated on the first install and kept
  # in the Secret "<prefix>-kafka-kraft". Only set it to reuse existing Kafka volumes.
  clusterId: ""

  auth:
    # How MES authenticates on the client listener (port 9093, always TLS):
    #   sasl - username "mes" and a password (SASL_SSL, mechanism PLAIN).
    #   mtls - client certificate with CN=mes (mutual TLS).
    method: sasl
    # Passwords of the Kafka users. Leave empty to generate random ones, which are kept
    # in the Secret "<prefix>-kafka-users" across upgrades.
    #   admin   - super user: broker-to-broker traffic and operations
    #   mes     - the CM MES application
    #   monitor - read-only user of the OpenTelemetry collector
    passwords:
      admin: ""
      mes: ""
      monitor: ""

  tls:
    # global.tls.mode=existing only. Secret with the broker certificate: tls.crt, tls.key
    # (PKCS#8, or RSA PKCS#1 which the chart converts) and ca.crt. The certificate must
    # be valid for the names shown by "helm template" in the TLS section, including
    # "*.<prefix>-kafka-headless.<namespace>.svc.<clusterDomain>".
    existingSecret: ""
    # global.tls.mode=existing and auth.method=mtls: Secret with the MES client
    # certificate (CN=mes): tls.crt, tls.key, ca.crt.
    existingClientSecret: ""
    # global.tls.mode=existing and auth.method=mtls, optional: Secret with a client
    # certificate with CN=monitor for the OpenTelemetry collector. When empty, the
    # collector uses the "monitor" user and password on port 9092 instead.
    existingMonitorSecret: ""
    # Certificate renewal (cert-manager renews every year; admins may rotate existing
    # Secrets). Each Kafka server checks its mounted certificate regularly.
    renewal:
      # How often the mounted certificate files are checked, in seconds.
      checkIntervalSeconds: 60
      # true = a renewed server certificate is loaded without restart (all listeners).
      # false = the server restarts to load it.
      dynamicReload: true
      # When a restart is needed (CA changed, dynamic reload failed or disabled), server
      # <n> waits n x this many minutes, so the servers never restart at the same time.
      # When replacing the CA, put the old and the new CA in ca.crt until every
      # certificate has been renewed.
      restartStaggerMinutes: 10
    # Note (existing mode): an RSA PKCS#1 key is converted into "<secret>-pkcs8" by the
    # chart, so after rotating such a Secret run "helm upgrade" to refresh the copy.

  storage:
    # Size of the data volume of each Kafka server.
    size: 50Gi
    # StorageClass of the data volumes. "" = global.storageClass.
    storageClass: ""

  # CPU and memory of each Kafka server. Kafka uses the memory above the Java heap as
  # file cache, so keep the limit well above the heap size.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 4Gi

  # Java heap of the Kafka server (about half of the memory limit).
  heapOpts: "-Xms2g -Xmx2g"
  # Extra JVM options (KAFKA_OPTS), e.g. "-Djava.net.preferIPv4Stack=true".
  extraJvmOpts: ""

  # Kafka server settings (server.properties). These are the durability defaults;
  # you can change them or add any other Kafka server setting here.
  # The replication factors must not be larger than kafka.replicas.
  # Listener, TLS, authentication and KRaft settings are managed by the chart.
  config:
    # Replicas of each partition of topics created without an explicit value.
    default.replication.factor: 3
    # Replicas that must acknowledge a write (acks=all) for it to succeed.
    min.insync.replicas: 2
    # Replicas of the internal topics (consumer offsets and transactions).
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    # CM MES creates its topics itself (it has the Create permission), so automatic
    # topic creation on first use stays disabled.
    auto.create.topics.enable: false
    # Never elect an out-of-sync replica as leader (would lose data).
    unclean.leader.election.enable: false
    # Keep messages for 7 days by default (MES may set its own per topic).
    log.retention.hours: 168

  # Time given to a Kafka server to move its partition leadership away and close its
  # logs cleanly before it is killed. Raise it for very large installations.
  terminationGracePeriodSeconds: 180

  probes:
    # The startup probe checks every 10 seconds that the broker answers requests. Log
    # recovery after an unclean shutdown can take long: 90 x 10s = 15 minutes.
    startupFailureThreshold: 90

  # Scheduling of the Kafka pods. Empty = use the global values.
  nodeSelector: {}
  tolerations: []
  # Full Kubernetes affinity. Empty = one Kafka pod per node (global.podAntiAffinity).
  affinity: {}

  # Extra annotations and labels for the Kafka pods.
  podAnnotations: {}
  podLabels: {}

  # Job that creates the ACLs of the "mes" and "monitor" users after every install and
  # upgrade (it can safely run many times).
  aclJob:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi

  # Pod used by "helm test": creates a topic, produces and consumes a message as "mes".
  test:
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi

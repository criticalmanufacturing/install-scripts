{{- /*
Values to type in the CM MES installer (printed by install.sh).
install.sh saves ca.crt of the ClickHouse TLS Secret as "clickhouse-ca.crt".
*/ -}}
{{- $fields := list
      (list "Address" (include "common.svcFqdn" (dict "ctx" . "name" (include "clickhouse.fullname" .))))
      (list "TCP Port" "9440")
      (list "HTTP Port" "8443")
      (list "Username" .Values.clickhouse.auth.username)
      (list "Password" (include "clickhouse.secret" (dict "ctx" . "key" "mes-password")))
      (list "Encrypt" "true")
      (list "Certificate Authority" "clickhouse-ca.crt")
      (list "Automatically provision additional users" "true") -}}
{{ include "common.connectionSecret" (dict "ctx" . "component" "clickhouse" "title" "ClickHouse" "order" "20" "caSecret" (include "clickhouse.tlsSecret" .) "fields" $fields) }}

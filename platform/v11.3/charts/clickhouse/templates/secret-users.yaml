{{- /*
Passwords and the users configuration (users.d). Passwords never go into a ConfigMap:
users.xml below holds only SHA-256 hashes, and the server configuration reads the other
secrets from environment variables (from_env).
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $mesPassword := include "clickhouse.secret" (dict "ctx" . "key" "mes-password") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.usersSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
  annotations:
    # Retain the administrator password when data volumes outlive the release.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mes-username: {{ $ch.auth.username | quote }}
  mes-password: {{ $mesPassword | quote }}
  users.xml: |
    <?xml version="1.0"?>
    <!-- Generated by the cmmes clickhouse chart. Merged over the image's users.xml. -->
    <clickhouse>
        <profiles>
            <!-- Applied to every session (default_profile), including the users that CM MES creates. -->
            <default>
                <!-- Required by CM MES (see the CM MES ClickHouse requirements). -->
                <allow_materialized_view_with_bad_select>1</allow_materialized_view_with_bad_select>
                <compatibility>25.3</compatibility>
            </default>
        </profiles>
        <users>
            <!-- Built-in user: only reachable from inside the pod, for troubleshooting with
                 kubectl exec (clickhouse-client). It cannot manage users (no access_management).
                 No password unless clickhouse.auth.defaultPassword is set: whoever can exec into the
                 pod already has access to the ClickHouse data volume. -->
            <default replace="replace">
                {{- with $ch.auth.defaultPassword }}
                <password_sha256_hex>{{ . | sha256sum }}</password_sha256_hex>
                {{- else }}
                <password></password>
                {{- end }}
                <networks>
                    <ip>::1</ip>
                    <ip>127.0.0.1</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
            </default>
            <!-- CM MES administration user: every privilege WITH GRANT OPTION, plus user,
                 role and named collection management. -->
            <{{ $ch.auth.username }}>
                <password_sha256_hex>{{ $mesPassword | sha256sum }}</password_sha256_hex>
                <networks>
                    <ip>::/0</ip>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>1</access_management>
                <named_collection_control>1</named_collection_control>
                <show_named_collections>1</show_named_collections>
                <show_named_collections_secrets>1</show_named_collections_secrets>
            </{{ $ch.auth.username }}>
        </users>
    {{- with $ch.extraUsersConfig }}
        <!-- clickhouse.extraUsersConfig -->
        {{- . | nindent 8 }}
    {{- end }}
    </clickhouse>

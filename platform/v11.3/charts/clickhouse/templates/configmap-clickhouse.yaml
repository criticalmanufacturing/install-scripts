{{- /*
ClickHouse server configuration, mounted as /etc/clickhouse-server/config.d and merged over
the image's config.xml. No secrets here: they come from environment variables (from_env).
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $cfg := $ch.config -}}
{{- $tls := "/etc/clickhouse-server/tls" -}}
{{- $ttl := int $cfg.systemLogTTLDays -}}
{{- $metricTtl := int $cfg.metricLogTTLDays -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.configMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "clickhouse") | nindent 4 }}
data:
  00-cmmes.xml: |
    <?xml version="1.0"?>
    <!-- Generated by the cmmes clickhouse chart. Merged over /etc/clickhouse-server/config.xml. -->
    <clickhouse>
        <!-- Logs go to the container output only (kubectl logs). No log files. -->
        <logger>
            <level>{{ include "clickhouse.xml" $cfg.logLevel }}</level>
            <console>1</console>
            <log remove="remove"/>
            <errorlog remove="remove"/>
        </logger>

        <timezone>UTC</timezone>

        <!-- On stop (pod deleted, rolling update, node drain): stop accepting connections, then
             let the running queries finish (half of terminationGracePeriodSeconds) instead of
             cancelling them at once. A cancelled INSERT can already be written, and a client
             that retries it would insert it twice. -->
        <shutdown_wait_unfinished_queries>1</shutdown_wait_unfinished_queries>
        <shutdown_wait_unfinished>{{ div (int $ch.terminationGracePeriodSeconds) 2 }}</shutdown_wait_unfinished>

        <!-- Listen on all addresses, IPv6 and IPv4. listen_try: a missing address family
             (e.g. IPv6 disabled on the node) is not an error. -->
        <listen_host>::</listen_host>
        <listen_host>0.0.0.0</listen_host>
        <listen_try>1</listen_try>

        <!-- Clients: TLS only. The plain-text ports of the image are removed. -->
        <http_port remove="remove"/>
        <tcp_port remove="remove"/>
        <mysql_port remove="remove"/>
        <postgresql_port remove="remove"/>
        <https_port>8443</https_port>
        <tcp_port_secure>9440</tcp_port_secure>

        <interserver_http_port remove="remove"/>
        <interserver_https_port remove="remove"/>

        {{- if include "common.observability.enabled" . }}
        <prometheus>
            <endpoint>/metrics</endpoint><port>9363</port>
            <metrics>true</metrics><events>true</events>
            <asynchronous_metrics>true</asynchronous_metrics><errors>true</errors>
        </prometheus>
        {{- end }}

        <openSSL>
            <!-- Native TLS and HTTPS. Clients do not need a certificate. -->
            <server>
                <certificateFile>{{ $tls }}/tls.crt</certificateFile>
                <privateKeyFile>{{ $tls }}/tls.key</privateKeyFile>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </server>
            <!-- Outgoing TLS for external HTTPS/S3 endpoints. Trusts the chart CA and system CAs. -->
            <client>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>true</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>

        <!-- Memory limit: a fraction of the container memory limit (cgroup). -->
        <max_server_memory_usage_to_ram_ratio>{{ $cfg.maxServerMemoryUsageToRamRatio }}</max_server_memory_usage_to_ram_ratio>
        <max_concurrent_queries>{{ int $cfg.maxConcurrentQueries }}</max_concurrent_queries>
        <!-- mlockall needs CAP_IPC_LOCK, which the pod does not have. -->
        <mlock_executable>false</mlock_executable>

        <!-- MES 11.3 provisions local databases and tables, without ON CLUSTER. -->
        <remote_servers remove="remove"/>
        <zookeeper remove="remove"/>
        <distributed_ddl remove="remove"/>
        <default_database_engine>Atomic</default_database_engine>
        <user_directories replace="replace">
            <users_xml><path>users.xml</path></users_xml>
            <local_directory><path>/var/lib/clickhouse/access/</path></local_directory>
        </user_directories>

        <!-- Retention of the system log tables, so that they do not fill the disk. -->
        {{- range $table := list "query_log" "query_views_log" "part_log" "error_log" "backup_log" "s3queue_log" }}
        <{{ $table }}>
            <ttl>event_date + INTERVAL {{ $ttl }} DAY DELETE</ttl>
        </{{ $table }}>
        {{- end }}
        {{- range $table := list "metric_log" "asynchronous_metric_log" "trace_log" "query_thread_log" "processors_profile_log" }}
        <{{ $table }}>
            <ttl>event_date + INTERVAL {{ $metricTtl }} DAY DELETE</ttl>
        </{{ $table }}>
        {{- end }}
        <text_log>
            <ttl>event_date + INTERVAL {{ $ttl }} DAY DELETE</ttl>
            <level>{{ include "clickhouse.xml" $cfg.logLevel }}</level>
        </text_log>
    </clickhouse>
  {{- with $ch.extraConfig }}
  90-extra.xml: |
    <?xml version="1.0"?>
    <!-- clickhouse.extraConfig -->
    <clickhouse>
        {{- . | nindent 8 }}
    </clickhouse>
  {{- end }}
  # clickhouse-client inside the server pod: TLS, trusting the chart CA.
  client.xml: |
    <?xml version="1.0"?>
    <config>
        <secure>true</secure>
        <port>9440</port>
        <openSSL>
            <client>
                <caConfig>{{ $tls }}/ca.crt</caConfig>
                <verificationMode>relaxed</verificationMode>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>
    </config>

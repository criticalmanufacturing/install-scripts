# Default values for the ClickHouse chart (Critical Manufacturing MES 11.3 dependencies).
#
# install.sh passes one values file to every chart. This chart reads only "global"
# and "clickhouse"; everything else is ignored.
#
# One ClickHouse server with local metadata, persistent storage and TLS.

# ---------------------------------------------------------------------------------
# Settings shared by all the dependency charts.
# ---------------------------------------------------------------------------------
global:
  # Prefix of every resource name, e.g. "cmmes" gives the StatefulSet "cmmes-clickhouse".
  namePrefix: cmmes
  # StorageClass for the persistent volumes. "" = the cluster default StorageClass.
  storageClass: ""
  # Private registry/mirror put in front of every image, e.g. "registry.example.com/mirror".
  # "" = pull from Docker Hub.
  imageRegistry: ""
  # Names of Secrets (type kubernetes.io/dockerconfigjson) used to pull the images.
  imagePullSecrets: []
  # auto = detect OpenShift; openshift / kubernetes = force it. On OpenShift the pods run
  # with the UID assigned by the restricted-v2 SCC.
  platform: auto
  # DNS domain of the cluster. Only change it if your cluster does not use cluster.local.
  clusterDomain: cluster.local
  # Scheduling preference shared with the other dependency charts.
  # soft = prefer different nodes, but allow sharing (small or test clusters).
  podAntiAffinity: hard
  # Run the pods only on nodes with these labels, e.g. {node-role.kubernetes.io/data: ""}.
  nodeSelector: {}
  # Tolerations for tainted nodes (Kubernetes format).
  tolerations: []
  tls:
    # How the TLS certificates are obtained:
    #   auto        - generated by Helm, signed by the CA in the Secret "<prefix>-ca"
    #                 (created by install.sh), and kept across upgrades.
    #   existing    - you provide the Secret (see clickhouse.tls below).
    #   certManager - cert-manager issues them, using global.tls.certManager. The issuer must
    #                 be a CA-type issuer (CA, Vault, ...) that fills "ca.crt" in the Secret:
    #                 ClickHouse clients use it to verify the server. Without it the pods
    #                 stop at start with an explicit error.
    mode: auto
    # Name of the CA Secret (tls.crt/tls.key) used in auto mode. "" = "<prefix>-ca".
    caSecret: ""
    # auto mode: set to true once to issue new certificates on the next upgrade.
    regenerate: false
    # auto mode: validity of the generated certificates, in days.
    validityDays: 1825
    certManager:
      # Name of the cert-manager Issuer or ClusterIssuer (required in certManager mode).
      issuerName: ""
      # ClusterIssuer or Issuer.
      issuerKind: ClusterIssuer
      issuerGroup: cert-manager.io

# ---------------------------------------------------------------------------------
# ClickHouse
# ---------------------------------------------------------------------------------
clickhouse:
  # Only used by install.sh to decide whether to install this chart.
  enabled: true

  image:
    repository: clickhouse/clickhouse-server
    tag: "25.3.3.42"
    pullPolicy: IfNotPresent

  # MES 11.3 supports this chart with one server only.
  replicas: 1

  auth:
    # The CM MES administration user. It can create databases, tables, users, roles,
    # settings profiles, quotas and named collections (CM MES "Automatically provision
    # additional ClickHouse users" creates the other MES users with it).
    username: mes
    # "" = generated once and kept across upgrades (see the connection Secret).
    password: ""
    # Password of the built-in "default" user. That user only accepts connections from
    # inside the ClickHouse pods (localhost) and is meant for troubleshooting with
    # "kubectl exec <pod> -- clickhouse-client". "" = no password (still localhost only).
    defaultPassword: ""

  tls:
    # tls.mode=existing: Secret with tls.crt, tls.key and ca.crt. Its certificate must
    # cover <prefix>-clickhouse, <prefix>-clickhouse-headless and the pod DNS name.
    existingSecret: ""

  storage:
    # Data volume of each ClickHouse server. CM recommends at least 1Ti in production.
    size: 100Gi
    # "" = global.storageClass.
    storageClass: ""

  # CM minimum for ClickHouse: 4 vCPU and 16 GB RAM (recommended: 8 vCPU, 32 GB).
  # Keep the memory request equal to the limit: ClickHouse sizes its caches and its memory
  # limit from the container memory limit.
  # Open files: ClickHouse raises its soft limit to the hard limit of the container runtime
  # (containerd/CRI-O default 1048576). Kubernetes cannot set ulimits; if the runtime hard
  # limit is lower than 262144, raise it on the nodes (ClickHouse logs a warning otherwise).
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      memory: 16Gi

  # Server tuning.
  config:
    # Log level written to the container output: warning, information, debug, trace.
    logLevel: information
    # Fraction of the container memory limit that ClickHouse may use (queries, merges,
    # caches). The rest is headroom that protects the pod from being OOM-killed.
    maxServerMemoryUsageToRamRatio: 0.85
    # Maximum number of queries running at the same time (ClickHouse default).
    maxConcurrentQueries: 1000
    # Days kept in the system log tables (query_log, part_log, error_log, text_log, ...).
    systemLogTTLDays: 30
    # Days kept in the high-volume system tables (metric_log, asynchronous_metric_log,
    # trace_log, query_metric_log, ...).
    metricLogTTLDays: 7

  # Expert settings: raw XML added inside <clickhouse>...</clickhouse> of the server
  # configuration (config.d) and of the users configuration (users.d). Example:
  #   extraConfig: |
  #     <max_table_size_to_drop>0</max_table_size_to_drop>
  # Do not put passwords in extraConfig (it is stored in a ConfigMap); extraUsersConfig is
  # stored in a Secret.
  extraConfig: ""
  extraUsersConfig: ""

  # Seconds given to ClickHouse to finish running queries and flush data when a pod stops.
  terminationGracePeriodSeconds: 120

  # Scheduling. Empty values use the global ones. A non-empty affinity replaces the default
  # anti-affinity (one ClickHouse server per node).
  nodeSelector: {}
  tolerations: []
  affinity: {}

observability:
  otlpEndpoint: ""

{{- with .Values.observability.headers }}
# Values of the HTTP headers sent to the OTLP endpoint (e.g. an API token).
# The collector reads them from environment variables, so they never appear in the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "otel.headersSecret" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" $ "component" "otel") | nindent 4 }}
type: Opaque
stringData:
  {{- $i := 0 }}
  {{- range $name, $value := . }}
  {{ include "otel.headerEnv" $i }}: {{ toString $value | quote }}
  {{- $i = add1 $i }}
  {{- end }}
{{- end }}

apiVersion: v2
name: otel
description: >-
  Optional OpenTelemetry collector for the Critical Manufacturing MES 11.3 dependencies.
  It scrapes Kafka, ClickHouse and RabbitMQ metrics, receives RustFS telemetry over OTLP and
  pushes everything to an OTLP/HTTP endpoint (CM Observability).
type: application
version: 11.3.0
appVersion: "0.161.0"
keywords:
  - opentelemetry
  - monitoring
  - critical-manufacturing
dependencies:
  - name: common
    version: 11.3.0
    repository: file://../common

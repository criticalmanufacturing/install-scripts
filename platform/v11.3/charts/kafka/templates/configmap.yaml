{{- $replicas := int (include "kafka.replicas" .) -}}
{{- $client := include "kafka.port.client" . -}}
{{- $internal := include "kafka.port.internal" . -}}
{{- $controller := include "kafka.port.controller" . -}}
{{- $config := .Values.kafka.config | default dict -}}
{{- /* Settings owned by the chart cannot be overridden through kafka.config. */ -}}
{{- $managed := list "process.roles" "node.id" "listeners" "advertised.listeners" "listener.security.protocol.map" "inter.broker.listener.name" "authorizer.class.name" "super.users" "allow.everyone.if.no.acl.found" "log.dirs" "log.dir" "metadata.log.dir" -}}
{{- range $k, $_ := $config -}}
{{- if or (has $k $managed) (hasPrefix "controller." $k) (hasPrefix "sasl." $k) (hasPrefix "ssl." $k) (hasPrefix "listener.name." $k) -}}
{{- fail (printf "kafka.config.%s is managed by the chart and cannot be set" $k) -}}
{{- end -}}
{{- end -}}
{{- range $k := list "default.replication.factor" "offsets.topic.replication.factor" "transaction.state.log.replication.factor" -}}
{{- if and (hasKey $config $k) (gt (int (index $config $k)) $replicas) -}}
{{- fail (printf "kafka.config.%s (%v) is larger than kafka.replicas (%d)" $k (index $config $k) $replicas) -}}
{{- end -}}
{{- end -}}
{{- if and (hasKey $config "min.insync.replicas") (hasKey $config "default.replication.factor") (gt (int (index $config "min.insync.replicas")) (int (index $config "default.replication.factor"))) -}}
{{- fail "kafka.config.min.insync.replicas must not be larger than kafka.config.default.replication.factor" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka.configMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "kafka") | nindent 4 }}
data:
  # Template of the server configuration. start.sh replaces @NODE_ID@ and @POD_FQDN@
  # and appends the JAAS settings (passwords come from the Secret, not from here).
  server.properties: |
    # ---- KRaft: every server is a broker and a controller (combined mode) ----
    process.roles=broker,controller
    node.id=@NODE_ID@
    controller.listener.names=CONTROLLER
    controller.quorum.voters={{ (include "kafka.kraft" . | fromJson).controllerVoters }}

    # ---- Listeners (all encrypted) ----
    #   CLIENT     {{ $client }}  MES and other clients (mutual TLS: client certificate required)
    #   INTERNAL   {{ $internal }}  broker-to-broker replication and administration (SASL_SSL, PLAIN)
    #   CONTROLLER {{ $controller }}  KRaft quorum (SASL_SSL, PLAIN)
    listeners=CLIENT://:{{ $client }},INTERNAL://:{{ $internal }},CONTROLLER://:{{ $controller }}
    advertised.listeners=CLIENT://@POD_FQDN@:{{ $client }},INTERNAL://@POD_FQDN@:{{ $internal }}
    listener.security.protocol.map=CLIENT:SSL,INTERNAL:SASL_SSL,CONTROLLER:SASL_SSL
    inter.broker.listener.name=INTERNAL
    sasl.enabled.mechanisms=PLAIN
    sasl.mechanism.inter.broker.protocol=PLAIN
    sasl.mechanism.controller.protocol=PLAIN

    # ---- TLS: PEM keystore (key + certificate chain) and truststore (CA) ----
    ssl.keystore.type=PEM
    ssl.keystore.location=/cm/run/keystore.pem
    ssl.truststore.type=PEM
    ssl.truststore.location=/cm/tls/ca.crt
    ssl.endpoint.identification.algorithm=https
    ssl.client.auth=none
    # Renewed certificates are reloaded at runtime (maintenance.sh); allow a renewed
    # certificate to have a different subject or SANs.
    ssl.allow.dn.changes=true
    ssl.allow.san.changes=true
    listener.name.client.ssl.client.auth=required
    # Client certificate "CN=mes,..." becomes the principal User:mes.
    ssl.principal.mapping.rules=RULE:^CN=([^,]+).*$/$1/,RULE:^.*[Cc][Nn]=([^,]+).*$/$1/,DEFAULT

    # ---- Authorization ----
    authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
    super.users=User:admin
    allow.everyone.if.no.acl.found=false

    # ---- Storage ----
    log.dirs=/var/lib/kafka/data/logs

    # ---- Tunables (kafka.config) ----
    {{- range $k, $v := $config }}
    {{ $k }}={{ $v }}
    {{- end }}

  # Log only to the console (kubectl logs); nothing is written to files.
  log4j.properties: |
    log4j.rootLogger=INFO, stdout
    log4j.appender.stdout=org.apache.log4j.ConsoleAppender
    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
    log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n
    log4j.logger.kafka.request.logger=WARN
    log4j.logger.kafka.network.RequestChannel$=WARN
    log4j.logger.kafka.authorizer.logger=WARN

  # Shared shell settings of the scripts below.
  common.sh: |
    RUN=/cm/run
    DATA=/var/lib/kafka/data
    LOGS="$DATA/logs"
    NODE_ID="${POD_NAME##*-}"
    POD_FQDN="${POD_NAME}.${HEADLESS_SERVICE}.${POD_NAMESPACE}.svc.${CLUSTER_DOMAIN}"
    SELF="${POD_FQDN}:{{ $internal }}"
    export RUN DATA LOGS NODE_ID POD_FQDN SELF
    log() { echo "[cm-kafka] $*"; }
    # Kafka command-line tools: small heap, console logging, nothing written to the image.
    # Usage: tool <script> <args...>
    tool() {
      local cmd="/opt/kafka/bin/$1"; shift
      ( unset KAFKA_OPTS KAFKA_LOG4J_OPTS; export KAFKA_HEAP_OPTS="-Xmx192m" LOG_DIR=/tmp/kafka-logs
        exec timeout "${TOOL_TIMEOUT:-60}" "$cmd" "$@" )
    }

  # Builds the per-pod configuration in /cm/run (emptyDir), formats the storage on the
  # first start, starts maintenance.sh in the background and runs Kafka.
  # Nothing is written to the image filesystem.
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    umask 077
    source /cm/scripts/common.sh
    case "$NODE_ID" in ''|*[!0-9]*) echo "Cannot derive node.id from pod name ${POD_NAME}" >&2; exit 1;; esac
    {{- include "kafka.script.checkCA" . | nindent 4 }}

    {{- include "kafka.script.escapeFns" . | nindent 4 }}
    ADMIN="$(jaas_escape "$KAFKA_ADMIN_PASSWORD")"
    {{- if include "common.observability.enabled" . }}
    MONITOR="$(jaas_escape "$KAFKA_MONITOR_PASSWORD")"
    {{- end }}
    PLAIN="org.apache.kafka.common.security.plain.PlainLoginModule required"

    # PEM keystore: private key (PKCS#8) followed by the certificate chain.
    bash /cm/scripts/keystore.sh

    sed -e "s|@NODE_ID@|${NODE_ID}|g" -e "s|@POD_FQDN@|${POD_FQDN}|g" /cm/scripts/server.properties > "$RUN/server.properties"
    {
      echo
      echo "# ---- SASL/PLAIN users (added by start.sh) ----"
      echo "listener.name.internal.plain.sasl.jaas.config=${PLAIN} username=\"admin\" password=\"${ADMIN}\" user_admin=\"${ADMIN}\"{{ if include "common.observability.enabled" . }} user_monitor=\"${MONITOR}\"{{ end }};"
      echo "listener.name.controller.plain.sasl.jaas.config=${PLAIN} username=\"admin\" password=\"${ADMIN}\" user_admin=\"${ADMIN}\";"
    } >> "$RUN/server.properties"

    # Client configuration of the admin user, for the probes, maintenance.sh and operators:
    #   kubectl exec <pod> -- bash -c '/opt/kafka/bin/kafka-topics.sh --bootstrap-server $(hostname -f):{{ $internal }} \
    #     --command-config /cm/run/admin.properties --list'
    cat > "$RUN/admin.properties" <<EOF
    security.protocol=SASL_SSL
    sasl.mechanism=PLAIN
    sasl.jaas.config=${PLAIN} username="admin" password="${ADMIN}";
    ssl.truststore.type=PEM
    ssl.truststore.location=/cm/tls/ca.crt
    EOF
    # Wait up to two minutes for the pod's DNS record before resolving quorum voters.
    if command -v getent >/dev/null 2>&1; then RESOLVE=(getent hosts)
    elif command -v nslookup >/dev/null 2>&1; then RESOLVE=(nslookup)
    else RESOLVE=(); fi
    if [ ${#RESOLVE[@]} -gt 0 ]; then
      for _ in $(seq 1 60); do
        if "${RESOLVE[@]}" "$POD_FQDN" >/dev/null 2>&1; then break; fi
        sleep 2
      done
    fi

    # Kafka 3.8 formats a static quorum; no Kafka 4.x voter-management flags.
    mkdir -p "$LOGS"
    if [ ! -f "$LOGS/meta.properties" ]; then
      TOOL_TIMEOUT=300 tool kafka-storage.sh format --config "$RUN/server.properties" \
        --cluster-id "$KAFKA_CLUSTER_ID" --ignore-formatted
    else
      log "Data volume already formatted"
    fi

    # Certificate maintenance runs next to Kafka in the same container.
    export KAFKA_PID=$$
    bash /cm/scripts/maintenance.sh &

    export KAFKA_HEAP_OPTS="${KAFKA_SERVER_HEAP_OPTS}"
    export KAFKA_LOG4J_OPTS="-Dlog4j.configuration=file:/cm/scripts/log4j.properties"
    export LOG_DIR=/tmp/kafka-logs
    # No "-loggc": GC logs would be written to files.
    export EXTRA_ARGS="-name kafkaServer"
    log "Starting Kafka node ${NODE_ID} (${POD_FQDN})"
    exec /opt/kafka/bin/kafka-server-start.sh "$RUN/server.properties"

  # (Re)builds /cm/run/keystore.pem atomically from the mounted Secret and records the
  # checksums of the files it was built from.
  keystore.sh: |
    #!/bin/bash
    set -euo pipefail
    umask 077
    RUN=/cm/run
    { cat /cm/tls/tls.key; echo; cat /cm/tls/tls.crt; } > "$RUN/keystore.pem.new"
    mv -f "$RUN/keystore.pem.new" "$RUN/keystore.pem"
    cat /cm/tls/tls.crt /cm/tls/tls.key | sha256sum | cut -d' ' -f1 > "$RUN/cert.sum"
    sha256sum < /cm/tls/ca.crt | cut -d' ' -f1 > "$RUN/ca.sum"

  # Kafka 3.8 reloads renewed certificates with a staggered restart.
  maintenance.sh: |
    #!/bin/bash
    set -uo pipefail
    source /cm/scripts/common.sh
    INTERVAL={{ int .Values.kafka.tls.renewal.checkIntervalSeconds }}
    STAGGER_MINUTES={{ int .Values.kafka.tls.renewal.restartStaggerMinutes }}

    staggered_restart() {
      local delay=$(( NODE_ID * STAGGER_MINUTES * 60 ))
      log "$1: restarting this server in ${delay}s (staggered by node id)"
      sleep "$delay"
      # Do not restart while partitions are under-replicated (wait up to 30 minutes).
      for _ in $(seq 1 60); do
        urp="$(tool kafka-topics.sh --bootstrap-server "$SELF" --command-config "$RUN/admin.properties" \
               --describe --under-replicated-partitions 2>/dev/null)" && [ -z "$urp" ] && break
        sleep 30
      done
      log "Restarting Kafka (controlled shutdown)"
      kill -TERM "$KAFKA_PID"
      exit 0
    }

    sleep 60
    while true; do
      if [ -s /cm/tls/ca.crt ] && [ -s /cm/tls/tls.crt ] && [ -s /cm/tls/tls.key ]; then
        ca_now="$(sha256sum < /cm/tls/ca.crt | cut -d' ' -f1)"
        cert_now="$(cat /cm/tls/tls.crt /cm/tls/tls.key | sha256sum | cut -d' ' -f1)"
        if [ "$ca_now" != "$(cat "$RUN/ca.sum")" ]; then
          staggered_restart "The CA certificate (ca.crt) changed"
        elif [ "$cert_now" != "$(cat "$RUN/cert.sum")" ]; then
          staggered_restart "The server certificate changed"
        fi
      fi
      sleep "$INTERVAL"
    done

  # Startup probe: the broker answers an admin request on its own INTERNAL listener.
  probe.sh: |
    #!/bin/bash
    source /cm/scripts/common.sh
    TOOL_TIMEOUT=25 tool kafka-cluster.sh cluster-id --bootstrap-server "$SELF" --config "$RUN/admin.properties"

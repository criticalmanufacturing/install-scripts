{{- if include "common.observability.enabled" . }}
{{- $data := dict "protocol" "SASL_SSL" "username" "monitor" "password" (include "kafka.password" (dict "ctx" . "user" "monitor")) "bootstrap" (include "kafka.brokerList" (dict "ctx" . "port" (include "kafka.port.internal" .))) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.monitoringSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "kafka") | nindent 4 }}
type: Opaque
data:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k | b64enc | quote }}
  {{- end }}
{{- end }}

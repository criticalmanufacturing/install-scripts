# Default values for the RabbitMQ chart (Critical Manufacturing MES 11.3 dependencies).
#
# install.sh passes one values file to every chart. This chart reads only "global"
# and "rabbitmq"; everything else is ignored. The defaults below are production defaults:
# most administrators only change the storage size and, if needed, the StorageClass.

# ---------------------------------------------------------------------------------
# Settings shared by all the dependency charts.
# ---------------------------------------------------------------------------------
global:
  # Prefix of every resource name, e.g. "cmmes" gives the StatefulSet "cmmes-rabbitmq".
  namePrefix: cmmes
  # StorageClass for the persistent volumes. "" = the cluster default StorageClass.
  storageClass: ""
  # Private registry/mirror put in front of every image, e.g. "registry.example.com/mirror".
  # "" = pull from Docker Hub.
  imageRegistry: ""
  # Names of Secrets (type kubernetes.io/dockerconfigjson) used to pull the images.
  imagePullSecrets: []
  # auto = detect OpenShift; openshift / kubernetes = force it. On OpenShift the pods run
  # with the UID assigned by the restricted-v2 SCC.
  platform: auto
  # DNS domain of the cluster. Only change it if your cluster does not use cluster.local.
  clusterDomain: cluster.local
  # Shared pod scheduling preference; this chart deploys one broker.
  # soft = prefer different nodes, but allow sharing.
  podAntiAffinity: hard
  # Run the pods only on nodes with these labels, e.g. {node-role.kubernetes.io/data: ""}.
  nodeSelector: {}
  # Tolerations for tainted nodes (Kubernetes format).
  tolerations: []
  tls:
    # How the TLS certificates are obtained:
    #   auto        - generated by Helm, signed by the CA in the Secret "<prefix>-ca"
    #                 (created by install.sh), and kept across upgrades.
    #   existing    - you provide the Secrets (see rabbitmq.tls below).
    #   certManager - cert-manager issues them, using global.tls.certManager.
    mode: auto
    # Name of the CA Secret (tls.crt/tls.key) used in auto mode. "" = "<prefix>-ca".
    caSecret: ""
    # auto mode: set to true once to issue new certificates on the next upgrade.
    regenerate: false
    # auto mode: validity of the generated certificates, in days.
    validityDays: 1825
    certManager:
      # Name of the cert-manager Issuer or ClusterIssuer (required in certManager mode).
      # It must be a CA-type issuer (e.g. "ca", or Vault with the CA chain) that fills
      # ca.crt in the issued Secrets: RabbitMQ and its clients need it. Without ca.crt the
      # RabbitMQ pods stop at start with an explicit error.
      issuerName: ""
      # ClusterIssuer or Issuer.
      issuerKind: ClusterIssuer
      issuerGroup: cert-manager.io

# ---------------------------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------------------------
rabbitmq:
  enabled: true
  # One broker, matching the Product 11.3 manifest. No clustering or queue mirroring.
  replicas: 1
  image:
    repository: rabbitmq
    tag: "3.13.7-management-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: mes
    # Generated once and retained with the data. Changes apply on the next upgrade.
    password: ""
    # Generated once; do not change after installation.
    erlangCookie: ""
  # Fixed after installation, as is auth.username.
  virtualHost: "/"
  tls:
    # Existing mode: Secret with tls.crt, tls.key and ca.crt, covering the Service FQDN.
    existingSecret: ""
    renewalCheckIntervalSeconds: 60
  storage:
    size: 10Gi
    storageClass: ""
  # Stop accepting publications when free disk space falls below this threshold.
  diskFreeLimit: 1GB
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 2Gi
  # Optional management UI/API, exposed only over HTTPS inside the cluster.
  # The MES user can manage resources in its virtual host, without administrator rights.
  management:
    enabled: false
  terminationGracePeriodSeconds: 120
  nodeSelector: {}
  tolerations: []
  affinity: {}
observability:
  otlpEndpoint: ""

{{- $fields := list
  (list "Host" (include "common.svcFqdn" (dict "ctx" . "name" (include "rabbitmq.fullname" .))))
  (list "Port" "5671")
  (list "Virtual Host" .Values.rabbitmq.virtualHost)
  (list "Username" .Values.rabbitmq.auth.username)
  (list "Password" (include "rabbitmq.password" .))
  (list "Use TLS" "true")
  (list "Use Client Certificates" "false")
  (list "Ssl Certificate Authority" (printf "%s:ca.crt" (include "rabbitmq.tlsSecret" .)))
  (list "Validate Certificate(s)" "true") -}}
{{ include "common.connectionSecret" (dict "ctx" . "component" "rabbitmq" "title" "RabbitMQ" "order" "25" "caSecret" (include "rabbitmq.tlsSecret" .) "fields" $fields) }}

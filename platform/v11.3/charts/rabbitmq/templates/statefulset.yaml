{{- include "rabbitmq.validate" . -}}
{{- $r := .Values.rabbitmq -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
spec:
  serviceName: {{ include "rabbitmq.headless" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "common.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" (dict "ctx" . "component" "rabbitmq") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ include (print $.Template.BasePath "/credentials.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $r.terminationGracePeriodSeconds }}
      {{- include "common.podSecurityContext" (dict "ctx" . "uid" 100 "gid" 101) | nindent 6 }}
      {{- with (include "common.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{- end }}
      {{- include "common.affinity" (dict "ctx" . "component" "rabbitmq" "affinity" $r.affinity) | nindent 6 }}
      {{- with (include "common.scheduling" (dict "ctx" . "nodeSelector" $r.nodeSelector "tolerations" $r.tolerations) | trim) }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: rabbitmq
          image: {{ include "common.image" (dict "ctx" . "image" $r.image) }}
          imagePullPolicy: {{ $r.image.pullPolicy }}
          {{- include "common.containerSecurityContext" . | nindent 10 }}
          command: ["/bin/sh", "/cm/config/start.sh"]
          env:
            - name: HOME
              value: /var/lib/rabbitmq
            - name: RABBITMQ_NODENAME
              value: {{ include "rabbitmq.nodeName" . | quote }}
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_CONFIG_FILE
              value: /cm/config/rabbitmq
            - name: RABBITMQ_ENABLED_PLUGINS_FILE
              value: /cm/config/enabled_plugins
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ include "rabbitmq.credentialsSecret" . }}
                  key: erlang-cookie
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 2:2 +A 8"
            - name: RABBITMQ_CTL_ERL_ARGS
              value: "+S 1:1 +A 2"
          ports:
            - name: amqps
              containerPort: 5671
            {{- if $r.management.enabled }}
            - name: management
              containerPort: 15671
            {{- end }}
            {{- if include "common.observability.enabled" . }}
            - name: metrics
              containerPort: 15692
            {{- end }}
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_local_alarms"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /cm/config
              readOnly: true
            - name: credentials
              mountPath: /cm/credentials
              readOnly: true
            - name: tls
              mountPath: /cm/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "rabbitmq.fullname" . }}
        - name: credentials
          secret:
            secretName: {{ include "rabbitmq.credentialsSecret" . }}
        - name: tls
          secret:
            secretName: {{ include "rabbitmq.tlsSecret" . }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (include "common.storageClass" (dict "ctx" . "storageClass" $r.storage.storageClass) | trim) }}{{ . | nindent 8 }}{{- end }}
        resources:
          requests:
            storage: {{ $r.storage.size | quote }}

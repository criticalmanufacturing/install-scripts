{{- include "rabbitmq.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rabbitmq.credentialsSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.auth.username | quote }}
  password: {{ include "rabbitmq.password" . | quote }}
  erlang-cookie: {{ include "rabbitmq.cookie" . | quote }}
  virtual-host: {{ .Values.rabbitmq.virtualHost | quote }}
  node-name: {{ include "rabbitmq.nodeName" . | quote }}
  definitions.json: |
    {{- $tags := list -}}
    {{- if .Values.rabbitmq.management.enabled -}}{{- $tags = list "management" -}}{{- end }}
    {{ dict "users" (list (dict "name" .Values.rabbitmq.auth.username "password" (include "rabbitmq.password" .) "tags" $tags)) "vhosts" (list (dict "name" .Values.rabbitmq.virtualHost)) "permissions" (list (dict "user" .Values.rabbitmq.auth.username "vhost" .Values.rabbitmq.virtualHost "configure" ".*" "write" ".*" "read" ".*")) | toJson }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "common.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps
    {{- if .Values.rabbitmq.management.enabled }}
    - name: management
      port: 15671
      targetPort: management
    {{- end }}
    {{- if include "common.observability.enabled" . }}
    - name: metrics
      port: 15692
      targetPort: metrics
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.headless" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "common.selectorLabels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" (dict "ctx" . "component" "rabbitmq") | nindent 4 }}
data:
  rabbitmq.conf: |
    listeners.tcp = none
    listeners.ssl.default = 5671
    ssl_options.cacertfile = /cm/tls/ca.crt
    ssl_options.certfile = /cm/tls/tls.crt
    ssl_options.keyfile = /cm/tls/tls.key
    ssl_options.verify = verify_peer
    ssl_options.fail_if_no_peer_cert = false
    ssl_options.versions.1 = tlsv1.3
    ssl_options.versions.2 = tlsv1.2
    definitions.import_backend = local_filesystem
    definitions.local.path = /cm/credentials/definitions.json
    default_queue_type = classic
    loopback_users.guest = true
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = {{ .Values.rabbitmq.diskFreeLimit }}
    log.console = true
    log.file = false
    {{- if .Values.rabbitmq.management.enabled }}
    management.ssl.port = 15671
    management.ssl.cacertfile = /cm/tls/ca.crt
    management.ssl.certfile = /cm/tls/tls.crt
    management.ssl.keyfile = /cm/tls/tls.key
    {{- end }}
  enabled_plugins: |
    {{- $plugins := list -}}
    {{- if .Values.rabbitmq.management.enabled -}}{{- $plugins = append $plugins "rabbitmq_management" -}}{{- end -}}
    {{- if include "common.observability.enabled" . -}}{{- $plugins = append $plugins "rabbitmq_prometheus" -}}{{- end }}
    [{{ join "," $plugins }}].
  start.sh: |
    #!/bin/sh
    set -eu
    umask 077
    printf '%s' "$RABBITMQ_ERLANG_COOKIE" > "$HOME/.erlang.cookie"
    chmod 600 "$HOME/.erlang.cookie"
    # Erlang caches PEM files. Clear that cache after a mounted certificate changes.
    (
      previous="$(sha256sum /cm/tls/tls.crt /cm/tls/tls.key /cm/tls/ca.crt)"
      while sleep {{ int .Values.rabbitmq.tls.renewalCheckIntervalSeconds | default 60 }}; do
        current="$(sha256sum /cm/tls/tls.crt /cm/tls/tls.key /cm/tls/ca.crt)"
        if [ "$current" != "$previous" ]; then
          if rabbitmqctl eval 'ssl:clear_pem_cache().' >/dev/null; then previous="$current"; fi
        fi
      done
    ) &
    exec rabbitmq-server

{{- if eq (include "s3.provider" .) "rustfs" }}
{{- $fields := list
      (list "Address" (include "s3.address" .))
      (list "Bucket Name" (include "s3.bucket" .))
      (list "AccessKey Id" (include "s3.mesAccessKey" .))
      (list "Secret Access Key" (include "s3.mesSecretKey" .))
      (list "Use Path Style" "true")
      (list "Certificate Authority" "s3-ca.crt")
      (list "(info) Endpoint URL" (include "s3.endpointUrl" .)) }}
{{ include "common.connectionSecret" (dict "ctx" . "component" "s3" "title" "S3" "order" "30" "caSecret" (include "s3.tlsSecret" .) "fields" $fields) }}
{{- end }}

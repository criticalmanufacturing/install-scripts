name: SaaS Connector container and Helm
on:
  pull_request:
    paths:
      - 'saas-connector/container/**'
      - 'saas-connector/helm/**'
      - 'saas-connector/tests/test_container.sh'
      - 'saas-connector/tests/test_helm.sh'
      - '.github/workflows/saas-connector-container.yml'
  push:
    branches: [main]
    tags: ['saas-connector-v*']
    paths:
      - 'saas-connector/container/**'
      - 'saas-connector/helm/**'
      - 'saas-connector/tests/test_container.sh'
      - 'saas-connector/tests/test_helm.sh'
      - '.github/workflows/saas-connector-container.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saas-connector-container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.18.0
      - name: Check Bash and chart
        run: |
          bash -n saas-connector/container/entrypoint.sh
          bash -n saas-connector/container/healthcheck.sh
          bash -n saas-connector/container/saas-connector-cli.sh
          bash -n saas-connector/tests/test_container.sh
          bash -n saas-connector/tests/test_helm.sh
          shellcheck -S style saas-connector/container/*.sh saas-connector/tests/test_container.sh saas-connector/tests/test_helm.sh
          bash saas-connector/tests/test_helm.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image for real Docker tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: saas-connector/container/Dockerfile
          load: true
          tags: saas-connector:dev
          cache-from: type=gha,scope=saas-connector-amd64
          cache-to: type=gha,scope=saas-connector-amd64,mode=max
      - name: Test the image in Docker
        run: bash saas-connector/tests/test_container.sh
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'criticalmanufacturing/install-scripts'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: criticalmanufacturing/saas-connector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Configure the DOCKERHUB_USERNAME Actions secret.' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Configure the DOCKERHUB_TOKEN Actions secret.' >&2; exit 1; }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Choose immutable image tags
        id: tags
        shell: bash
        run: |
          {
            echo 'tags<<TAGS'
            echo "$IMAGE:sha-$GITHUB_SHA"
            if [[ $GITHUB_REF == refs/tags/saas-connector-v* ]]; then
              version=${GITHUB_REF#refs/tags/saas-connector-v}
              [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a tag such as saas-connector-v0.1.0.' >&2; exit 1; }
              echo "$IMAGE:$version"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: saas-connector/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=saas-connector-amd64
            type=gha,scope=saas-connector-multiarch
          cache-to: type=gha,scope=saas-connector-multiarch,mode=max

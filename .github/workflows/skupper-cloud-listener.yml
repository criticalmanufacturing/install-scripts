name: Skupper cloud listener checks
on:
  pull_request:
    paths:
      - 'skupper/setup-skupper-cloud-listener.sh'
      - 'skupper/tests/test_cloud_listener.py'
      - '.github/workflows/skupper-cloud-listener.yml'
  push:
    paths:
      - 'skupper/setup-skupper-cloud-listener.sh'
      - 'skupper/tests/test_cloud_listener.py'
      - '.github/workflows/skupper-cloud-listener.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml shellcheck
      - name: Check Bash syntax and style
        run: |
          bash -n skupper/setup-skupper-cloud-listener.sh
          shellcheck skupper/setup-skupper-cloud-listener.sh
      - name: Run hermetic installer tests
        run: python3 -m unittest discover -s skupper/tests -p test_cloud_listener.py -v

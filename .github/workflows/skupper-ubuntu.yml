name: Skupper Ubuntu
on:
  pull_request:
    paths: ['skupper/setup-skupper-ubuntu.sh', 'skupper/tests/test_ubuntu.py', '.github/workflows/skupper-ubuntu.yml']
  push:
    paths: ['skupper/setup-skupper-ubuntu.sh', 'skupper/tests/test_ubuntu.py', '.github/workflows/skupper-ubuntu.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck python3-yaml
      - name: Check script and isolated behavior
        run: |
          bash -n skupper/setup-skupper-ubuntu.sh
          shellcheck -S style skupper/setup-skupper-ubuntu.sh
          python3 -m unittest discover -s skupper/tests -p 'test_ubuntu.py'
